<article th:fragment="card(attempt, question)" class="dash-card" xmlns:th="http://www.thymeleaf.org">
    <div class="exercise-muted small mb-2" th:text="${'Câu hỏi ' + (question.orderIndex + 1) + ' · ' + question.points + ' điểm'}">Question</div>
    <h2 class="h5 mb-3" th:text="${question.questionText}">Question text</h2>

    <form th:action="@{/exercises/attempt/{id}/answer(id=${attempt.id})}"
          th:method="post"
          th:attr="hx-post=@{/exercises/attempt/{id}/answer(id=${attempt.id})}, hx-target=${'#feedback-' + question.id}"
          hx-swap="innerHTML">
        <input type="hidden" name="questionId" th:value="${question.id}">

        <div th:if="${question.questionType.name() == 'MULTIPLE_CHOICE'}" class="d-grid gap-2 mb-3">
            <label class="btn btn-outline-light text-start" th:each="option : ${question.options}">
                <input class="form-check-input me-2" type="radio" name="answer" th:value="${option}" required>
                <span th:text="${option}">Option</span>
            </label>
        </div>

        <div th:if="${question.questionType.name() == 'FILL_BLANK' || question.questionType.name() == 'LISTENING' || question.questionType.name() == 'SENTENCE_REORDER'}" class="mb-3">
            <input class="form-control" type="text" name="answer" placeholder="Nhập câu trả lời của bạn..." required>
        </div>

        <div th:if="${question.questionType.name() == 'WRITING'}" class="mb-3">
            <textarea class="form-control" name="answer" rows="5" placeholder="Viết câu trả lời của bạn..." required></textarea>
        </div>

        <button class="btn btn-primary" type="submit">
            <i class="bi bi-send"></i> Nộp câu trả lời
        </button>
    </form>

    <div class="mt-3" th:id="${'feedback-' + question.id}"></div>
</article>
