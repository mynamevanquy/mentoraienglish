<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Hồ sơ cá nhân</title>
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 0 auto;
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-layout-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 28px;
        }

        @media (max-width: 768px) {
            .profile-layout-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Avatar Card Styling */
        .avatar-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 32px 24px;
        }

        .profile-avatar-large {
            width: 96px;
            height: 96px;
            background: var(--brand-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 38px;
            box-shadow: 0 8px 24px rgba(108, 99, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .profile-name-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .premium-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(255, 179, 0, 0.15) 0%, rgba(255, 215, 0, 0.25) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.08);
        }

        .profile-info-list {
            width: 100%;
            border-top: 1px solid var(--surface-border);
            padding-top: 20px;
            text-align: left;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .info-label {
            color: var(--text-secondary);
        }

        .info-value {
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Form Card Styling */
        .form-card {
            padding: 32px;
        }

        .card-header-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-header-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid var(--surface-border) !important;
            border-radius: 10px !important;
            padding: 12px 16px !important;
            font-size: 14px !important;
            color: var(--text-primary) !important;
            transition: all 0.2s ease !important;
        }

        .form-control:focus {
            border-color: var(--brand-primary) !important;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15) !important;
            background: rgba(255, 255, 255, 0.05) !important;
        }

        .form-control:disabled, .form-control[readonly] {
            background: rgba(255, 255, 255, 0.01) !important;
            border-color: rgba(255, 255, 255, 0.03) !important;
            color: rgba(240, 240, 255, 0.4) !important;
            cursor: not-allowed;
        }

        .btn-save {
            background: var(--brand-gradient);
            border: none;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(108, 99, 255, 0.3);
            opacity: 0.95;
        }

        .field-error {
            font-size: 12px;
            color: #FF6B6B;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .has-error input {
            border-color: rgba(255, 107, 107, 0.5) !important;
            background: rgba(255, 107, 107, 0.05) !important;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="profile-container">
            <!-- Header navigation -->
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h1 class="welcome-title">👤 Hồ sơ cá nhân</h1>
                    <p class="welcome-subtitle">Quản lý và cập nhật thông tin cá nhân của bạn.</p>
                </div>
            </div>

            <!-- Profile Content layout -->
            <div class="profile-layout-grid">
                
                <!-- Left avatar card -->
                <div class="dash-card avatar-card">
                    <div class="profile-avatar-large" th:text="${#strings.substring(user.fullName, 0, 1)}">U</div>
                    <h3 class="profile-name-title" th:text="${user.fullName}">Học viên</h3>
                    <div class="premium-badge">
                        <i class="bi bi-star-fill"></i> Thành viên Premium
                    </div>
                    
                    <div class="profile-info-list">
                        <div class="info-item">
                            <span class="info-label">Email đăng nhập</span>
                            <span class="info-value" th:text="${user.email}">user@example.com</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Vai trò</span>
                            <span class="info-value">Học viên</span>
                        </div>
                        <div class="info-item" th:if="${user.createdAt != null}">
                            <span class="info-label">Ngày tham gia</span>
                            <span class="info-value" th:text="${#strings.substring(user.createdAt.toString(), 0, 10)}">2026-05-25</span>
                        </div>
                    </div>
                </div>

                <!-- Right profile form card -->
                <div class="dash-card form-card">
                    <div class="card-header-title">
                        <i class="bi bi-pencil-square text-primary"></i> Chỉnh sửa thông tin
                    </div>
                    <p class="card-header-subtitle">Cập nhật họ tên hiển thị trong hệ thống và chứng nhận học tập.</p>

                    <!-- Form -->
                    <form th:action="@{/profile}" th:object="${profileRequest}" th:method="post" novalidate>
                        <!-- CSRF Token -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- Full Name Field -->
                        <div class="mb-4" th:classappend="${#fields.hasErrors('fullName')} ? 'has-error'">
                            <label for="fullName" class="form-label">Họ và tên</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control" 
                                   placeholder="Nhập họ và tên đầy đủ" required />
                            <div class="field-error" th:if="${#fields.hasErrors('fullName')}">
                                <i class="bi bi-exclamation-circle-fill"></i>
                                <span th:errors="*{fullName}"></span>
                            </div>
                        </div>

                        <!-- Email Field (Readonly) -->
                        <div class="mb-4">
                            <label for="email" class="form-label">Địa chỉ Email (Không thể thay đổi)</label>
                            <input type="email" id="email" th:value="${user.email}" class="form-control" readonly />
                        </div>

                        <!-- Role Field (Readonly) -->
                        <div class="mb-4">
                            <label for="role" class="form-label">Cấp độ tài khoản (Không thể thay đổi)</label>
                            <input type="text" id="role" value="Học viên Premium" class="form-control" readonly />
                        </div>

                        <div class="text-end pt-2">
                            <button type="submit" class="btn-save">
                                <i class="bi bi-check-lg"></i> Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Global Toast trigger on successMessage/errorMessage -->
        <script th:inline="javascript">
            /*<![CDATA[*/
            document.addEventListener('DOMContentLoaded', () => {
                const successMsg = [[${successMessage}]];
                if (successMsg) {
                    showAppToast(successMsg, 'success');
                }
            });
            /*]]>*/
        </script>
    </div>
</body>
</html>
