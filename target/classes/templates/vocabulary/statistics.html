<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Thống kê từ vựng</title>
    <style>
        .stats-header {
            margin-bottom: 32px;
        }

        .stats-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stats-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        @media (max-width: 992px) {
            .stats-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .stats-cards {
                grid-template-columns: 1fr;
            }
        }

        .stat-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-align: center;
        }

        .stat-card-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .stat-card-value {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-card-label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        .chart-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        @media (max-width: 992px) {
            .chart-section {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .chart-card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .chart-container {
            width: 100%;
            height: 280px;
            position: relative;
        }

        .vocab-muted {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <header class="stats-header d-flex justify-content-between align-items-start gap-3">
        <div>
            <h1 class="stats-title">Thống kê từ vựng</h1>
            <p class="stats-subtitle mb-0">Theo dõi quá trình học từ vựng của bạn</p>
        </div>
        <a class="btn btn-outline-light" th:href="@{/vocabulary}">
            <i class="bi bi-arrow-left"></i> Danh sách từ vựng
        </a>
    </header>

    <!-- Summary Cards -->
    <div class="stats-cards">
        <div class="stat-card">
            <div class="stat-card-icon">
                <i class="bi bi-book text-primary"></i>
            </div>
            <div class="stat-card-value" th:text="${stats.totalWords}">0</div>
            <div class="stat-card-label">Từ đã học</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon">
                <i class="bi bi-check-circle text-success"></i>
            </div>
            <div class="stat-card-value" th:text="${stats.masteredWords}">0</div>
            <div class="stat-card-label">Từ thành thạo</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon">
                <i class="bi bi-clock-history text-warning"></i>
            </div>
            <div class="stat-card-value" th:text="${stats.dueReviewCount}">0</div>
            <div class="stat-card-label">Cần ôn tập</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon">
                <i class="bi bi-arrow-repeat text-info"></i>
            </div>
            <div class="stat-card-value" th:text="${stats.totalReviews}">0</div>
            <div class="stat-card-label">Lượt ôn tập</div>
        </div>
    </div>

    <!-- Charts -->
    <div class="chart-section">
        <!-- Mastery Distribution -->
        <div class="chart-card">
            <h3 class="chart-card-title">Phân bố mức độ thành thạo</h3>
            <div class="chart-container">
                <canvas id="masteryChart"></canvas>
            </div>
        </div>

        <!-- Words Added Over Time -->
        <div class="chart-card">
            <h3 class="chart-card-title">Từ vựng đã thêm (30 ngày)</h3>
            <div class="chart-container">
                <canvas id="wordsAddedChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Reviews Over Time -->
    <div class="chart-card">
        <h3 class="chart-card-title">Lượt ôn tập (30 ngày)</h3>
        <div class="chart-container" style="height: 240px;">
            <canvas id="reviewsChart"></canvas>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        (function() {
            const chartDefaults = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1E1E30',
                        titleColor: '#F0F0FF',
                        bodyColor: '#A5A5C7',
                        borderColor: 'rgba(255, 255, 255, 0.08)',
                        borderWidth: 1,
                        cornerRadius: 8,
                        padding: 10
                    }
                }
            };

            const scaleDefaults = {
                x: {
                    grid: { color: 'rgba(255, 255, 255, 0.03)', drawTicks: false },
                    ticks: { color: 'rgba(240, 240, 255, 0.4)', font: { family: 'Inter', size: 11 } },
                    border: { display: false }
                },
                y: {
                    grid: { color: 'rgba(255, 255, 255, 0.04)', drawTicks: false },
                    ticks: { color: 'rgba(240, 240, 255, 0.4)', font: { family: 'Inter', size: 11 } },
                    border: { display: false },
                    beginAtZero: true
                }
            };

            // Mastery Distribution (Doughnut)
            const masteryData = JSON.parse(/*[[${masteryChartJson}]]*/ '{}');
            if (masteryData.datasets) {
                new Chart(document.getElementById('masteryChart').getContext('2d'), {
                    type: 'doughnut',
                    data: masteryData,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    color: 'rgba(240, 240, 255, 0.6)',
                                    padding: 16,
                                    font: { family: 'Inter', size: 12 }
                                }
                            },
                            tooltip: chartDefaults.plugins.tooltip
                        },
                        cutout: '60%'
                    }
                });
            }

            // Words Added Over Time (Line)
            const wordsAddedData = JSON.parse(/*[[${wordsAddedChartJson}]]*/ '{}');
            if (wordsAddedData.datasets) {
                const ctx1 = document.getElementById('wordsAddedChart').getContext('2d');
                const grad1 = ctx1.createLinearGradient(0, 0, 0, 260);
                grad1.addColorStop(0, 'rgba(108, 99, 255, 0.25)');
                grad1.addColorStop(1, 'rgba(108, 99, 255, 0.00)');
                wordsAddedData.datasets[0].backgroundColor = grad1;

                new Chart(ctx1, {
                    type: 'line',
                    data: wordsAddedData,
                    options: { ...chartDefaults, scales: scaleDefaults }
                });
            }

            // Reviews Over Time (Line)
            const reviewsData = JSON.parse(/*[[${reviewsChartJson}]]*/ '{}');
            if (reviewsData.datasets) {
                const ctx2 = document.getElementById('reviewsChart').getContext('2d');
                const grad2 = ctx2.createLinearGradient(0, 0, 0, 220);
                grad2.addColorStop(0, 'rgba(16, 185, 129, 0.25)');
                grad2.addColorStop(1, 'rgba(16, 185, 129, 0.00)');
                reviewsData.datasets[0].backgroundColor = grad2;

                new Chart(ctx2, {
                    type: 'line',
                    data: reviewsData,
                    options: { ...chartDefaults, scales: scaleDefaults }
                });
            }
        })();
    </script>
</th:block>
</body>
</html>
