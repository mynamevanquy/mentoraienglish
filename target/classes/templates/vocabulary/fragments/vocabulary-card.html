<div xmlns:th="http://www.thymeleaf.org">
    <article th:fragment="summary(vocabulary)"
             class="dash-card vocab-card"
             th:if="${vocabulary != null and vocabulary.id != null}">
        <div class="d-flex justify-content-between gap-2 mb-3">
            <div>
                <h3 class="vocab-word" th:text="${vocabulary.word}">word</h3>
                <div class="vocab-muted" th:text="${vocabulary.pronunciation ?: 'Không có phát âm'}">/wɜːd/</div>
            </div>
            <span class="badge text-bg-secondary align-self-start" th:text="${vocabulary.difficultyLevel}">BEGINNER</span>
        </div>
        <p class="mb-3" th:text="${vocabulary.definitionEn}">Definition</p>
        <button class="btn btn-sm btn-outline-light"
                type="button"
                th:attr="hx-get=@{/vocabulary/{id}(id=${vocabulary.id})}"
                hx-target="closest article"
                hx-swap="outerHTML">
            <i class="bi bi-eye"></i> Chi tiết
        </button>
    </article>

    <article th:fragment="detail" class="dash-card vocab-card expanded-card">
        <div class="d-flex justify-content-between gap-3 mb-3">
            <div>
                <h3 class="vocab-word" th:text="${vocabulary.word}">word</h3>
                <div class="vocab-muted">
                    <span th:text="${vocabulary.pronunciation ?: 'Không có phát âm'}">/wɜːd/</span>
                    <span th:if="${vocabulary.partOfSpeech}" th:text="${' · ' + vocabulary.partOfSpeech}">noun</span>
                </div>
            </div>
            <button class="btn btn-sm btn-primary"
                    type="button"
                    th:attr="hx-post=@{/vocabulary/{id}/add(id=${vocabulary.id})}"
                    hx-target="closest article"
                    hx-swap="outerHTML"
                    th:disabled="${added == true}">
                <i class="bi" th:classappend="${added == true} ? 'bi-check2' : 'bi-plus-lg'"></i>
                <span th:text="${added == true} ? 'Đã thêm' : 'Thêm'">Thêm</span>
            </button>
        </div>

        <div class="mb-3">
            <div class="vocab-muted small text-uppercase">Tiếng Anh</div>
            <p class="mb-2" th:text="${vocabulary.definitionEn}">English definition</p>
            <div class="vocab-muted small text-uppercase">Tiếng Việt</div>
            <p class="mb-0" th:text="${vocabulary.definitionVi ?: 'Chưa có bản dịch tiếng Việt.'}">Vietnamese definition</p>
        </div>

        <div th:if="${vocabulary.examples != null && !vocabulary.examples.isEmpty()}" class="mb-3">
            <div class="vocab-muted small text-uppercase mb-2">Ví dụ</div>
            <ul class="mb-0">
                <li th:each="example : ${vocabulary.examples}"
                    th:text="${example['sentence'] ?: example.toString()}">Example sentence</li>
            </ul>
        </div>

        <div class="d-flex gap-2 flex-wrap mb-3">
            <span class="badge rounded-pill text-bg-info" th:each="synonym : ${vocabulary.synonyms}" th:text="${synonym}">synonym</span>
            <span class="badge rounded-pill text-bg-warning" th:each="antonym : ${vocabulary.antonyms}" th:text="${antonym}">antonym</span>
        </div>

        <div th:id="${'ai-explanation-' + vocabulary.id}">
            <button class="btn btn-sm btn-outline-light"
                    type="button"
                    th:attr="hx-get=@{/vocabulary/{id}/ai-explanation(id=${vocabulary.id})}, hx-target=${'#ai-explanation-' + vocabulary.id}"
                    hx-swap="innerHTML">
                <i class="bi bi-stars"></i> Giải thích bởi AI
            </button>
        </div>
    </article>

    <div th:fragment="aiExplanation" class="border-top border-secondary pt-3 mt-3">
        <div class="vocab-muted small text-uppercase mb-2">Giải thích bởi AI</div>
        <p class="mb-2" th:text="${explanation.definition()}">AI definition</p>
        <p class="mb-2" th:if="${explanation.vietnameseMeaning()}" th:text="${explanation.vietnameseMeaning()}">Meaning</p>
        <ul class="mb-0" th:if="${explanation.examples() != null && !explanation.examples().isEmpty()}">
            <li th:each="example : ${explanation.examples()}" th:text="${example}">Example</li>
        </ul>
    </div>
</div>
