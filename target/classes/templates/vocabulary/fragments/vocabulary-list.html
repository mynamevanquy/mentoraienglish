<div th:fragment="list(vocabularies)" xmlns:th="http://www.thymeleaf.org">
    <div th:if="${vocabularies == null or vocabularies.isEmpty()}" class="text-center py-5 vocab-muted">
        Không tìm thấy từ vựng nào.
    </div>

    <div th:if="${vocabularies != null and !vocabularies.isEmpty()}" class="vocab-grid">
        <div th:each="vocabulary : ${vocabularies.content}">
            <div th:replace="~{vocabulary/fragments/vocabulary-card :: summary(${vocabulary})}"></div>
        </div>
    </div>

    <div class="mt-4"
         th:if="${vocabularies != null and vocabularies.totalPages > 1}"
         th:replace="~{fragments/pagination :: pagination(${vocabularies.number}, ${vocabularies.totalPages}, ${listBaseUrl}, '#vocabulary-list')}">
    </div>
</div>
