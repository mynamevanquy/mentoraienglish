<div xmlns:th="http://www.thymeleaf.org" class="dash-card">
    <div th:if="${errorMessage != null}" class="text-warning">
        <div class="d-flex gap-2 align-items-center mb-2">
            <i class="bi bi-exclamation-triangle"></i>
            <strong>Chưa kiểm tra được</strong>
        </div>
        <p class="mb-0" th:text="${errorMessage}">Có lỗi xảy ra.</p>
    </div>

    <div th:if="${errorMessage == null and !result.hasErrors()}">
        <div class="d-flex gap-2 align-items-center text-success mb-2">
            <i class="bi bi-check-circle"></i>
            <strong>Câu viết ổn</strong>
        </div>
        <p class="mb-0 grammar-muted">AI chưa phát hiện lỗi ngữ pháp rõ ràng.</p>
    </div>

    <div th:if="${errorMessage == null and result.hasErrors()}">
        <h3 class="h6 mb-2">Gợi ý sửa</h3>
        <p class="grammar-muted small mb-1">Bản đã sửa</p>
        <p class="mb-3" th:text="${result.correctedText()}">Corrected text</p>
        <div class="d-grid gap-2">
            <div th:each="correction : ${result.corrections()}" class="p-3 rounded border border-secondary">
                <div class="small grammar-muted" th:text="${correction.errorType()}">Error type</div>
                <div>
                    <span class="text-danger" th:text="${correction.originalSegment()}">Original</span>
                    <i class="bi bi-arrow-right mx-2 grammar-muted"></i>
                    <span class="text-success" th:text="${correction.correctedSegment()}">Corrected</span>
                </div>
                <p class="small grammar-muted mb-0 mt-2" th:text="${correction.explanation()}">Explanation</p>
            </div>
        </div>
    </div>
</div>
