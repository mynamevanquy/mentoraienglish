<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Quản lý người dùng</title>
    <style>
        .admin-users {
            max-width: 1280px;
            margin: 0 auto;
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 6px;
        }

        .page-subtitle {
            color: var(--text-secondary);
            margin: 0;
            font-size: 14px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 24px;
            align-items: start;
        }

        .panel {
            padding: 24px;
        }

        .filter-row {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) 150px 150px auto;
            gap: 12px;
            margin-bottom: 20px;
        }

        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid var(--surface-border) !important;
            border-radius: 10px !important;
            color: var(--text-primary) !important;
            font-size: 14px !important;
        }

        .form-select option {
            color: #111827;
        }

        .form-label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .admin-table {
            color: var(--text-primary);
            margin-bottom: 0;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
        }

        .admin-table th {
            background: rgba(255, 255, 255, 0.07);
            color: rgba(240, 240, 255, 0.78);
            border-color: rgba(255, 255, 255, 0.08);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .admin-table td {
            background: rgba(255, 255, 255, 0.025);
            border-color: rgba(255, 255, 255, 0.06);
            vertical-align: middle;
            font-size: 14px;
        }

        .admin-table tbody tr:hover td {
            background: rgba(78, 205, 196, 0.07);
        }

        .muted {
            color: rgba(240, 240, 255, 0.68);
        }

        .user-name-cell {
            color: #ffffff;
            font-weight: 700;
        }

        .admin-table td.created-date {
            color: #ffffff !important;
            font-weight: 500;
        }

        .status-badge,
        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            color: #52d273;
            background: rgba(82, 210, 115, 0.12);
            border: 1px solid rgba(82, 210, 115, 0.24);
        }

        .status-disabled {
            color: #ffb84d;
            background: rgba(255, 184, 77, 0.12);
            border: 1px solid rgba(255, 184, 77, 0.24);
        }

        .role-badge {
            color: #8fd8ff;
            background: rgba(143, 216, 255, 0.12);
            border: 1px solid rgba(143, 216, 255, 0.22);
        }

        .role-admin {
            color: #f7d774;
            background: rgba(247, 215, 116, 0.13);
            border-color: rgba(247, 215, 116, 0.28);
        }

        .role-user {
            color: #8fd8ff;
            background: rgba(143, 216, 255, 0.12);
            border-color: rgba(143, 216, 255, 0.22);
        }

        .btn-primary-soft,
        .btn-danger-soft,
        .btn-ghost {
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary-soft {
            background: var(--brand-gradient);
            color: #fff;
            border: 0;
            padding: 10px 16px;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            border: 1px solid var(--surface-border);
            padding: 8px 12px;
            text-decoration: none;
        }

        .btn-danger-soft {
            background: rgba(255, 107, 107, 0.1);
            color: #ff8080;
            border: 1px solid rgba(255, 107, 107, 0.2);
            padding: 8px 12px;
        }

        .field-error,
        .form-error {
            color: #ff8080;
            font-size: 12px;
            margin-top: 6px;
        }

        .side-section + .side-section {
            border-top: 1px solid var(--surface-border);
            margin-top: 24px;
            padding-top: 24px;
        }

        .pagination .page-link {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--surface-border);
            color: var(--text-secondary);
        }

        .pagination .active .page-link {
            background: var(--brand-primary);
            border-color: var(--brand-primary);
            color: #fff;
        }

        @media (max-width: 1100px) {
            .admin-grid,
            .filter-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="admin-users">
        <div class="page-head">
            <div>
                <h1 class="page-title">Quản lý người dùng</h1>
                <p class="page-subtitle">Tạo tài khoản, cập nhật vai trò, khóa/mở khóa và đặt lại mật khẩu.</p>
            </div>
        </div>

        <div class="admin-grid">
            <section class="dash-card panel">
                <form th:action="@{/admin/users}" method="get" class="filter-row">
                    <input type="search" name="keyword" class="form-control" placeholder="Tìm theo tên hoặc email"
                           th:value="${keyword}">
                    <select name="role" class="form-select">
                        <option value="">Tất cả vai trò</option>
                        <option th:each="role : ${roles}" th:value="${role}"
                                th:text="${role.name() == 'ADMIN' ? 'Quản trị' : 'Học viên'}"
                                th:selected="${selectedRole == role}">USER</option>
                    </select>
                    <select name="enabled" class="form-select">
                        <option value="">Mọi trạng thái</option>
                        <option value="true" th:selected="${selectedEnabled == true}">Đang hoạt động</option>
                        <option value="false" th:selected="${selectedEnabled == false}">Đã khóa</option>
                    </select>
                    <button class="btn-primary-soft" type="submit">
                        <i class="bi bi-search"></i> Lọc
                    </button>
                </form>

                <div class="table-responsive">
                    <table class="table admin-table">
                        <thead>
                        <tr>
                            <th>Người dùng</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Ngày tạo</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users.content}">
                            <td>
                                <div class="user-name-cell" th:text="${user.fullName()}">Nguyễn Văn A</div>
                                <div class="muted" th:text="${user.email()}">user@example.com</div>
                            </td>
                            <td>
                                <span class="role-badge"
                                      th:classappend="${user.role().name() == 'ADMIN'} ? 'role-admin' : 'role-user'"
                                      th:text="${user.roleLabel()}">Học viên</span>
                            </td>
                            <td>
                                <span th:if="${user.enabled()}" class="status-badge status-active">
                                    <i class="bi bi-check-circle"></i> Hoạt động
                                </span>
                                <span th:unless="${user.enabled()}" class="status-badge status-disabled">
                                    <i class="bi bi-pause-circle"></i> Đã khóa
                                </span>
                            </td>
                            <td class="created-date" th:text="${user.createdAt() != null ? #strings.substring(user.createdAt().toString(), 0, 10) : '-'}">2026-06-01</td>
                            <td>
                                <div class="d-flex justify-content-end gap-2 flex-wrap">
                                    <a class="btn-ghost" th:href="@{/admin/users/{id}/edit(id=${user.id()})}">
                                        <i class="bi bi-pencil"></i> Sửa
                                    </a>
                                    <form th:action="@{/admin/users/{id}/toggle-enabled(id=${user.id()})}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn-ghost"
                                                th:text="${user.enabled() ? 'Khóa' : 'Mở khóa'}">Khóa</button>
                                    </form>
                                    <form th:action="@{/admin/users/{id}/delete(id=${user.id()})}" method="post"
                                          onsubmit="return confirm('Xóa người dùng này?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn-danger-soft">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${users.empty}">
                            <td colspan="5" class="text-center muted py-4">Không có người dùng phù hợp.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <nav class="mt-4" th:if="${users.totalPages > 1}">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/admin/users(page=${users.number - 1},keyword=${keyword},role=${selectedRole},enabled=${selectedEnabled})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li class="page-item" th:each="pageNo : ${#numbers.sequence(0, users.totalPages - 1)}"
                            th:classappend="${users.number == pageNo} ? 'active'">
                            <a class="page-link" th:text="${pageNo + 1}"
                               th:href="@{/admin/users(page=${pageNo},keyword=${keyword},role=${selectedRole},enabled=${selectedEnabled})}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/admin/users(page=${users.number + 1},keyword=${keyword},role=${selectedRole},enabled=${selectedEnabled})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </section>

            <aside class="dash-card panel">
                <div class="side-section">
                    <h2 class="h5 mb-3">Tạo người dùng</h2>
                    <form th:action="@{/admin/users}" th:object="${createRequest}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="form-error mb-3" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                        <div class="mb-3">
                            <label class="form-label" for="createFullName">Họ tên</label>
                            <input id="createFullName" class="form-control" th:field="*{fullName}">
                            <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="createEmail">Email</label>
                            <input id="createEmail" type="email" class="form-control" th:field="*{email}">
                            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="createPassword">Mật khẩu</label>
                            <input id="createPassword" type="password" class="form-control" th:field="*{password}">
                            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="createRole">Vai trò</label>
                            <select id="createRole" class="form-select" th:field="*{role}">
                                <option th:each="role : ${roles}" th:value="${role}"
                                        th:text="${role.name() == 'ADMIN' ? 'Quản trị' : 'Học viên'}">USER</option>
                            </select>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" role="switch" id="createEnabled" th:field="*{enabled}">
                            <label class="form-check-label muted" for="createEnabled">Cho phép đăng nhập</label>
                        </div>
                        <button type="submit" class="btn-primary-soft w-100">
                            <i class="bi bi-person-plus"></i> Tạo tài khoản
                        </button>
                    </form>
                </div>

                <div class="side-section" th:if="${editingUser != null}">
                    <h2 class="h5 mb-3">Chỉnh sửa người dùng</h2>
                    <form th:action="@{/admin/users/{id}(id=${editingUser.id})}" th:object="${updateRequest}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="form-error mb-3" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                        <div class="mb-3">
                            <label class="form-label" for="editFullName">Họ tên</label>
                            <input id="editFullName" class="form-control" th:field="*{fullName}">
                            <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="editEmail">Email</label>
                            <input id="editEmail" type="email" class="form-control" th:field="*{email}">
                            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="editRole">Vai trò</label>
                            <select id="editRole" class="form-select" th:field="*{role}">
                                <option th:each="role : ${roles}" th:value="${role}"
                                        th:text="${role.name() == 'ADMIN' ? 'Quản trị' : 'Học viên'}">USER</option>
                            </select>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" role="switch" id="editEnabled" th:field="*{enabled}">
                            <label class="form-check-label muted" for="editEnabled">Cho phép đăng nhập</label>
                        </div>
                        <button type="submit" class="btn-primary-soft w-100">
                            <i class="bi bi-save"></i> Lưu thay đổi
                        </button>
                    </form>

                    <form class="mt-4" th:action="@{/admin/users/{id}/password(id=${editingUser.id})}"
                          th:object="${resetPasswordRequest}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <label class="form-label" for="newPassword">Đặt lại mật khẩu</label>
                        <div class="d-flex gap-2">
                            <input id="newPassword" type="password" class="form-control" th:field="*{newPassword}" placeholder="Mật khẩu mới">
                            <button type="submit" class="btn-ghost">Đổi</button>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                    </form>
                </div>
            </aside>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const successMsg = [[${successMessage}]];
            const errorMsg = [[${errorMessage}]];
            if (successMsg) {
                showAppToast(successMsg, 'success');
            }
            if (errorMsg) {
                showAppToast(errorMsg, 'error');
            }
        });
    </script>
</div>
</body>
</html>
