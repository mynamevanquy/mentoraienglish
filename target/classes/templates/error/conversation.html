<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head>
    <title th:text="${status} + ' - Lỗi'">Lỗi</title>
</head>
<body>
<div layout:fragment="content">
    <section class="dash-card text-center py-5">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: rgba(255, 107, 107, 0.1); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
            <i class="bi bi-exclamation-triangle" style="font-size: 2rem; color: #ff6b6b;"></i>
        </div>
        <h1 class="fw-bold mb-2" style="font-size: 3rem; color: var(--text-primary);" th:text="${status}">500</h1>
        <p class="mb-4" style="font-size: 1.1rem; color: rgba(240, 240, 255, 0.5);" th:text="${error}">Đã xảy ra lỗi nội bộ.</p>
        <a th:href="@{/conversation}" class="btn btn-primary px-4" style="border-radius: 10px;">
            <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách hội thoại
        </a>
    </section>
</div>
</body>
</html>
