<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 — Không có quyền truy cập</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <style>
        :root {
            --brand-primary: #6C63FF;
            --brand-secondary: #4ECDC4;
            --brand-gradient: linear-gradient(135deg, #6C63FF 0%, #4ECDC4 100%);
            --surface: #07070F;
            --surface-card: rgba(255, 255, 255, 0.03);
            --surface-border: rgba(255, 255, 255, 0.06);
            --text-primary: #F0F0FF;
            --text-secondary: rgba(240, 240, 255, 0.6);
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--surface);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: #FF6B6B;
            filter: blur(120px);
            opacity: 0.08;
            border-radius: 50%;
            top: -150px;
            left: -150px;
            z-index: -1;
        }

        .error-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 56px 40px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
        }

        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: 110px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .btn-home {
            background: var(--brand-gradient);
            color: #fff;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.3);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-home:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 12px 30px rgba(108, 99, 255, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">403</div>
        <h1>Khu vực hạn chế! 🔐</h1>
        <p>Tài khoản của bạn không có đủ quyền hạn để truy cập vào khu vực này. Nếu đây là sự nhầm lẫn, vui lòng liên hệ Ban quản trị hệ thống.</p>
        <a href="/dashboard" class="btn-home"><i class="bi bi-house-door-fill"></i> Quay lại Dashboard</a>
    </div>
</body>
</html>
