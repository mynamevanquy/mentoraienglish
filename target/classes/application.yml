spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:englishai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:db/migration
    repair-on-migrate: true
    validate-on-migrate: false

  session:
    store-type: none # Use standard in-memory servlet container session for local dev

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}

# Gitlawb Opengateway Configuration
openai:
  api:
    key: ${OPENGATEWAY_API_KEY:mock-key}
    url: https://opengateway.gitlawb.com/v1

# Logging configurations for development
logging:
  level:
    root: INFO
    com.englishai: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.results: TRACE

# ── Application-level security properties ──────────────────────────────────
app:
  security:
    # Remember-me signing key – override via APP_SECURITY_REMEMBER_ME_KEY env var in production
    remember-me-key: ${APP_SECURITY_REMEMBER_ME_KEY:mentorAIDefaultKey-changeMeInProd}

# Rate limiting using Bucket4j starter
bucket4j:
  enabled: true
  filters:
    - cache-name: buckets
      filter-method: servlet
      url: /api/.*
      rate-limits:
        - bandwidths:
            - capacity: 60
              time: 1
              unit: minutes
              refill-speed: greedy
