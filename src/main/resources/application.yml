spring:
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
  main:
    allow-bean-definition-overriding: true
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:englishai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:120000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:20000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:5000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME:120000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:600000}
      data-source-properties:
        tcpKeepAlive: true

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        jdbc:
          batch_size: 25
          time_zone: Asia/Ho_Chi_Minh
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:false}
    clean-on-validation-error: false
    locations: classpath:db/migration
    repair-on-migrate: true
    validate-on-migrate: false

  session:
    store-type: ${SESSION_STORE_TYPE:none}
    redis:
      namespace: mentor-ai-english:session

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8081}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

groq:
  ai:
    key: ${GROQ_API_KEY:${GROQ_AI_API_KEY:}}
    url: ${GROQ_AI_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_AI_MODEL:llama-3.3-70b-versatile}
    chat-model: ${GROQ_AI_CHAT_MODEL:${groq.ai.model}}
    exercise-model: ${GROQ_AI_EXERCISE_MODEL:${groq.ai.model}}

logging:
  level:
    root: INFO
    com.englishai: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.results: WARN
    org.springframework.web: WARN

app:
  security:
    remember-me-key: ${APP_SECURITY_REMEMBER_ME_KEY:mentorAIDefaultKey-changeMeInProd}
  password-reset:
    base-url: ${APP_BASE_URL:http://localhost:${SERVER_PORT:8081}}
    token-validity: ${PASSWORD_RESET_TOKEN_VALIDITY:30m}
    from-email: ${MAIL_FROM:no-reply@mentorai.local}
    mail-enabled: ${PASSWORD_RESET_MAIL_ENABLED:false}
  adaptive-learning:
    enabled: ${ADAPTIVE_LEARNING_ENABLED:true}
    default-level: ${ADAPTIVE_LEARNING_DEFAULT_LEVEL:BEGINNER}
    minimum-evidence-attempts: ${ADAPTIVE_MIN_EVIDENCE_ATTEMPTS:3}
    established-minimum-attempts: ${ADAPTIVE_ESTABLISHED_MIN_ATTEMPTS:10}
    recent-attempt-window: ${ADAPTIVE_RECENT_ATTEMPT_WINDOW:10}
    older-attempt-weight: ${ADAPTIVE_OLDER_ATTEMPT_WEIGHT:0.5}
    maximum-score-weight: ${ADAPTIVE_MAXIMUM_SCORE_WEIGHT:10}
    minimum-seconds-per-point: ${ADAPTIVE_MINIMUM_SECONDS_PER_POINT:2}
    intermediate:
      minimum-attempts: ${ADAPTIVE_INTERMEDIATE_MIN_ATTEMPTS:5}
      minimum-average-score: ${ADAPTIVE_INTERMEDIATE_MIN_SCORE:80}
      minimum-skill-areas: ${ADAPTIVE_INTERMEDIATE_MIN_SKILL_AREAS:2}
      minimum-skill-score: ${ADAPTIVE_INTERMEDIATE_MIN_SKILL_SCORE:50}
    advanced:
      minimum-attempts: ${ADAPTIVE_ADVANCED_MIN_ATTEMPTS:8}
      minimum-average-score: ${ADAPTIVE_ADVANCED_MIN_SCORE:80}
      minimum-skill-areas: ${ADAPTIVE_ADVANCED_MIN_SKILL_AREAS:3}
      minimum-skill-score: ${ADAPTIVE_ADVANCED_MIN_SKILL_SCORE:60}

bucket4j:
  enabled: true
  filters:
    - cache-name: buckets
      filter-method: servlet
      url: /api/.*
      rate-limits:
        - bandwidths:
            - capacity: ${RATE_LIMIT_CAPACITY:60}
              time: 1
              unit: minutes
              refill-speed: greedy
