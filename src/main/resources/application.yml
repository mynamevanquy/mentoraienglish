spring:
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
  main:
    allow-bean-definition-overriding: true
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:englishai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        jdbc:
          batch_size: 25
          time_zone: Asia/Ho_Chi_Minh
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:false}
    clean-on-validation-error: false
    locations: classpath:db/migration
    repair-on-migrate: true
    validate-on-migrate: false

  session:
    store-type: ${SESSION_STORE_TYPE:none}
    redis:
      namespace: mentor-ai-english:session

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

server:
  port: ${SERVER_PORT:8081}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

groq:
  ai:
    key: ${GROQ_API_KEY:${GROQ_AI_API_KEY:}}
    url: ${GROQ_AI_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_AI_MODEL:llama-3.3-70b-versatile}
    chat-model: ${GROQ_AI_CHAT_MODEL:${groq.ai.model}}
    exercise-model: ${GROQ_AI_EXERCISE_MODEL:${groq.ai.model}}

logging:
  level:
    root: INFO
    com.englishai: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.results: WARN
    org.springframework.web: WARN

app:
  security:
    remember-me-key: ${APP_SECURITY_REMEMBER_ME_KEY:mentorAIDefaultKey-changeMeInProd}

bucket4j:
  enabled: true
  filters:
    - cache-name: buckets
      filter-method: servlet
      url: /api/.*
      rate-limits:
        - bandwidths:
            - capacity: ${RATE_LIMIT_CAPACITY:60}
              time: 1
              unit: minutes
              refill-speed: greedy
