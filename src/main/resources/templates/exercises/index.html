<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Luyện tập</title>
    <style>
        .exercise-muted { color: var(--text-secondary); }
        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 24px;
        }
        .exercise-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .exercise-filter {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 190px 170px auto;
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (max-width: 992px) {
            .exercise-header { flex-direction: column; }
            .exercise-filter { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <header class="exercise-header">
        <div>
            <h1 class="h3 mb-1">Luyện tập & Đánh giá</h1>
            <p class="exercise-muted mb-0">Luyện tập ngữ pháp, từ vựng, viết và nghe hiểu.</p>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <span class="badge text-bg-info" th:if="${adaptiveSelection}">Đang lọc theo trình độ</span>
            <a class="btn btn-primary" th:href="@{/exercises/generate}">
                <i class="bi bi-stars"></i> Tự tạo bài tập
            </a>
        </div>
    </header>

    <section class="dash-card">
        <form class="exercise-filter" th:action="@{/exercises}" th:method="get">
            <input class="form-control" type="search" name="keyword" th:value="${filter.keyword}" placeholder="Tìm kiếm bài tập...">
            <select class="form-select" name="exerciseType" aria-label="Lọc theo dạng bài">
                <option value="">Tất cả dạng bài</option>
                <option th:each="type : ${exerciseTypes}" th:value="${type.name()}" th:selected="${filter.exerciseType == type}" th:text="${@messageHelper.exerciseType(type)}">MULTIPLE_CHOICE</option>
            </select>
            <select class="form-select" name="difficulty" aria-label="Lọc theo trình độ">
                <option value="">Tự động theo trình độ</option>
                <option th:each="level : ${levels}" th:value="${level.name()}" th:selected="${filter.difficulty == level}" th:text="${@messageHelper.level(level)}">BEGINNER</option>
            </select>
            <button class="btn btn-outline-light" type="submit" aria-label="Tìm kiếm"><i class="bi bi-search"></i></button>
        </form>

        <div th:if="${exercises.isEmpty()}" class="text-center py-5 exercise-muted">Không tìm thấy bài luyện tập nào.</div>

        <div th:if="${!exercises.isEmpty()}" class="exercise-grid">
            <article class="dash-card" th:each="exercise : ${exercises.content}">
                <div class="d-flex justify-content-between gap-2 mb-3">
                    <span class="badge text-bg-info" th:text="${exercise.exerciseType}">TYPE</span>
                    <span class="badge text-bg-secondary" th:text="${exercise.difficultyLevel}">LEVEL</span>
                </div>
                <h2 class="h5" th:text="${exercise.title}">Exercise title</h2>
                <p class="exercise-muted" th:text="${exercise.description ?: 'Chưa có mô tả.'}">Description</p>
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <span class="exercise-muted small" th:text="${exercise.questionCount + ' câu hỏi'}">0 questions</span>
                    <a class="btn btn-sm btn-primary" th:href="@{/exercises/{id}(id=${exercise.id})}">Bắt đầu</a>
                </div>
            </article>
        </div>

        <nav class="mt-4" th:if="${exercises.totalPages > 1}" aria-label="Exercise pagination">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:classappend="${exercises.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="${listBaseUrl + (listBaseUrl.contains('?') ? '&page=' : '?page=') + (exercises.number - 1)}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
                <li class="page-item"
                    th:each="pageNo : ${#numbers.sequence(0, exercises.totalPages - 1)}"
                    th:classappend="${exercises.number == pageNo} ? 'active'">
                    <a class="page-link"
                       th:href="${listBaseUrl + (listBaseUrl.contains('?') ? '&page=' : '?page=') + pageNo}"
                       th:text="${pageNo + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${exercises.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="${listBaseUrl + (listBaseUrl.contains('?') ? '&page=' : '?page=') + (exercises.number + 1)}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </section>
</div>
</body>
</html>
