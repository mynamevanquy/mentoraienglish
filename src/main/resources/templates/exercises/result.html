<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Kết quả bài luyện tập</title>
    <style>.exercise-muted { color: var(--text-secondary); }</style>
</head>
<body>
<div layout:fragment="content">
    <section class="dash-card mb-4">
        <div class="d-flex justify-content-between align-items-start gap-3">
            <div>
                <h1 class="h3 mb-1" th:text="${result.exercise.title}">Exercise</h1>
                <p class="exercise-muted mb-0">Chi tiết kết quả</p>
            </div>
            <div class="text-end">
                <div class="display-6 fw-bold" th:text="${#numbers.formatDecimal(result.percentage, 1, 1) + '%'}">0%</div>
                <div class="exercise-muted" th:text="${result.score + '/' + result.maxScore + ' điểm'}">0/0 points</div>
            </div>
        </div>
    </section>

    <section class="d-grid gap-3">
        <article class="dash-card" th:each="answer : ${result.answers}">
            <div class="d-flex justify-content-between gap-3 mb-2">
                <h2 class="h6 mb-0" th:text="${answer.questionText}">Question</h2>
                <span class="badge" th:classappend="${answer.correct} ? ' text-bg-success' : ' text-bg-warning'" th:text="${answer.pointsEarned + '/' + answer.maxPoints}">0/1</span>
            </div>
            <p class="mb-1"><span class="exercise-muted">Câu trả lời của bạn: </span><span th:text="${answer.userAnswer}">answer</span></p>
            <p class="mb-1" th:if="${!answer.correct}">
                <span class="exercise-muted">Đáp án đúng: </span><span th:text="${answer.correctAnswer}">correct answer</span>
            </p>
            <p class="mb-1" th:if="${answer.explanation}" th:text="${answer.explanation}">Explanation</p>
            <p class="mb-0" th:if="${answer.aiFeedback}" th:text="${answer.aiFeedback}">AI feedback</p>
        </article>
    </section>
</div>
</body>
</html>
