<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Làm bài luyện tập</title>
    <style>
        .exercise-muted { color: var(--text-secondary); }
        .question-stack { display: grid; gap: 16px; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="alert alert-warning" th:if="${errorMessage}" th:text="${errorMessage}">Có lỗi xảy ra.</div>

    <form th:action="@{/exercises/attempt/{id}/submit(id=${attempt.id})}" method="post">
        <header class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
                <h1 class="h3 mb-1" th:text="${detail.exercise.title}">Bài luyện tập</h1>
                <p class="exercise-muted mb-0">
                    Chọn hoặc nhập tất cả đáp án, sau đó nộp bài một lần.
                </p>
            </div>
            <a class="btn btn-outline-light"
               th:href="@{/exercises/{id}(id=${attempt.exerciseId})}">
                <i class="bi bi-arrow-left"></i> Quay lại
            </a>
        </header>

        <section class="question-stack">
            <div th:if="${detail.questions.isEmpty()}" class="alert alert-danger">
                Bài luyện tập chưa có câu hỏi.
            </div>

            <article th:each="question : ${detail.questions}" class="dash-card">
                <div class="exercise-muted small mb-2"
                     th:text="${'Câu hỏi ' + (question.orderIndex + 1) + ' · ' + question.points + ' điểm'}">
                    Câu hỏi
                </div>
                <h2 class="h5 mb-3" th:text="${question.questionText}">Nội dung câu hỏi</h2>

                <div th:if="${question.questionType.name() == 'MULTIPLE_CHOICE'}" class="d-grid gap-2">
                    <label class="btn btn-outline-light text-start" th:each="option : ${question.options}">
                        <input class="form-check-input me-2"
                               type="radio"
                               th:name="${'answer_' + question.id}"
                               th:value="${option}"
                               required>
                        <span th:text="${option}">Đáp án</span>
                    </label>
                </div>

                <div th:if="${question.questionType.name() == 'FILL_BLANK'
                             || question.questionType.name() == 'LISTENING'
                             || question.questionType.name() == 'SENTENCE_REORDER'}">
                    <input class="form-control"
                           type="text"
                           th:name="${'answer_' + question.id}"
                           placeholder="Nhập câu trả lời của bạn..."
                           required>
                </div>

                <div th:if="${question.questionType.name() == 'WRITING'}">
                    <textarea class="form-control"
                              th:name="${'answer_' + question.id}"
                              rows="5"
                              placeholder="Viết câu trả lời của bạn..."
                              required></textarea>
                </div>
            </article>
        </section>

        <div class="d-flex justify-content-end mt-4" th:if="${!detail.questions.isEmpty()}">
            <button class="btn btn-success btn-lg" type="submit">
                <i class="bi bi-check2-circle"></i> Nộp toàn bộ bài
            </button>
        </div>
    </form>
</div>
</body>
</html>
