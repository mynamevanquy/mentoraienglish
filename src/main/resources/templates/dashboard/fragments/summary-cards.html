<div id="summary-section" class="dashboard-grid-stats" xmlns:th="http://www.thymeleaf.org">
    <!-- Streak Card -->
    <div class="dash-card stat-card streak-card">
        <div class="stat-icon-wrapper flex-center">🔥</div>
        <div class="stat-content">
            <span class="stat-label">Chuỗi ngày học</span>
            <h3 class="stat-value" th:text="${summary.currentStreakDays + ' ngày'}">0 ngày</h3>
            <span class="stat-meta">Học liên tục hàng ngày để giữ lửa!</span>
        </div>
    </div>

    <!-- Vocab Card -->
    <div class="dash-card stat-card vocab-card">
        <div class="stat-icon-wrapper flex-center">📚</div>
        <div class="stat-content">
            <span class="stat-label">Từ vựng đã nắm vững</span>
            <h3 class="stat-value" th:text="${summary.vocabularyMastered}">0</h3>
            <span class="stat-meta text-warning" th:if="${summary.vocabularyDueReview > 0}">
                ⚠️ Cần ôn tập: <strong th:text="${summary.vocabularyDueReview}">0</strong> từ
            </span>
            <span class="stat-meta text-success" th:if="${summary.vocabularyDueReview == 0}">
                🎉 Đã ôn tập hết từ vựng!
            </span>
        </div>
    </div>

    <!-- Exercises Card -->
    <div class="dash-card stat-card exercises-card">
        <div class="stat-icon-wrapper flex-center">📝</div>
        <div class="stat-content">
            <span class="stat-label">Bài tập hoàn thành tuần này</span>
            <h3 class="stat-value" th:text="${summary.exercisesCompletedThisWeek}">0</h3>
            <span class="stat-meta">
                Điểm trung bình: <strong th:text="${#numbers.formatDecimal(summary.averageExerciseScore, 1, 1) + '%'}">0%</strong>
            </span>
        </div>
    </div>

    <!-- XP Card -->
    <div class="dash-card stat-card xp-card">
        <div class="stat-icon-wrapper flex-center">⚡</div>
        <div class="stat-content">
            <span class="stat-label">Tổng kinh nghiệm (XP)</span>
            <h3 class="stat-value" th:text="${summary.totalXp + ' XP'}">0 XP</h3>
            <span class="stat-meta" th:text="${'Hội thoại đang hoạt động: ' + summary.activeConversations}">Hội thoại đang hoạt động: 0</span>
        </div>
    </div>
</div>

<style>
    .stat-card {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 20px;
        padding: 24px;
    }

    .stat-icon-wrapper {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .stat-content {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .stat-label {
        font-size: 13px;
        color: rgba(240, 240, 255, 0.55);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .stat-value {
        font-size: 26px;
        font-weight: 700;
        color: #F0F0FF;
    }

    .stat-meta {
        font-size: 12px;
        color: rgba(240, 240, 255, 0.4);
    }

    .text-warning {
        color: #F59E0B !important;
    }

    .text-success {
        color: #10B981 !important;
    }

    /* Subtle Card Color Themes */
    .streak-card .stat-icon-wrapper {
        background: rgba(239, 68, 68, 0.1);
        color: #EF4444;
    }

    .vocab-card .stat-icon-wrapper {
        background: rgba(16, 185, 129, 0.1);
        color: #10B981;
    }

    .exercises-card .stat-icon-wrapper {
        background: rgba(59, 130, 246, 0.1);
        color: #3B82F6;
    }

    .xp-card .stat-icon-wrapper {
        background: rgba(245, 158, 11, 0.1);
        color: #F59E0B;
    }
</style>
