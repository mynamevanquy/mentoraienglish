<div xmlns:th="http://www.thymeleaf.org">
    <!-- If list of weak topics is empty -->
    <div th:if="${#lists.isEmpty(weakTopics)}" class="empty-weak-topics flex-center">
        <div class="empty-icon">🎉</div>
        <p class="empty-text">Tuyệt vời! Không có chủ điểm yếu nào được ghi nhận. Hãy tiếp tục làm bài tập nhé!</p>
    </div>

    <!-- Weak Topics list -->
    <div th:unless="${#lists.isEmpty(weakTopics)}" class="weak-topics-list">
        <div th:each="topic : ${weakTopics}" class="weak-topic-item">
            <div class="topic-info">
                <span class="topic-title" th:text="${topic.topicTitle}">Grammar Topic</span>
                <span class="topic-meta" th:text="${topic.attemptCount + ' lượt làm'}">0 lượt làm</span>
            </div>
            <div class="progress-bar-wrapper">
                <div class="progress-bar-outer">
                    <!-- Dynamic width and color depending on score -->
                    <div class="progress-bar-inner"
                         th:style="'width: ' + ${topic.averageScore} + '%; background: ' + (${topic.averageScore < 50} ? '#EF4444' : '#F59E0B')">
                    </div>
                </div>
                <span class="topic-score"
                      th:classappend="${topic.averageScore < 50} ? 'text-danger' : 'text-warning'"
                      th:text="${#numbers.formatDecimal(topic.averageScore, 1, 1) + '%'}">
                      0%
                </span>
            </div>
        </div>
    </div>
</div>

<style>
    .empty-weak-topics {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
        height: 280px;
    }

    .empty-icon {
        font-size: 48px;
        margin-bottom: 12px;
    }

    .empty-text {
        color: rgba(240, 240, 255, 0.45);
        font-size: 14px;
        max-width: 260px;
    }

    .weak-topics-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding-top: 10px;
    }

    .weak-topic-item {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .topic-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .topic-title {
        font-size: 14px;
        font-weight: 600;
        color: #F0F0FF;
    }

    .topic-meta {
        font-size: 12px;
        color: rgba(240, 240, 255, 0.4);
    }

    .progress-bar-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .progress-bar-outer {
        flex: 1;
        height: 6px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
        overflow: hidden;
    }

    .progress-bar-inner {
        height: 100%;
        border-radius: 3px;
        transition: width 0.3s ease;
    }

    .topic-score {
        font-size: 13px;
        font-weight: 600;
        min-width: 42px;
        text-align: right;
    }

    .text-danger {
        color: #EF4444 !important;
    }

    .text-warning {
        color: #F59E0B !important;
    }
</style>
