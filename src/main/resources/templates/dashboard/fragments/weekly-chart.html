<div style="width: 100%; height: 280px; position: relative;">
    <canvas id="weeklyChart"></canvas>
</div>

<script th:inline="javascript">
    (function() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const weeklyData = JSON.parse(/*[[${weeklyChartJson}]]*/ '{}');

        // Dark theme premium Chart.js options
        const options = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false // Hide legend since it's just one dataset
                },
                tooltip: {
                    backgroundColor: '#1E1E30',
                    titleColor: '#F0F0FF',
                    bodyColor: '#A5A5C7',
                    borderColor: 'rgba(255, 255, 255, 0.08)',
                    borderWidth: 1,
                    cornerRadius: 8,
                    padding: 10,
                    displayColors: false,
                    callbacks: {
                        label: function(context) {
                            return ` ${context.parsed.y} phút`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: {
                        display: false // Hide vertical gridlines
                    },
                    ticks: {
                        color: 'rgba(240, 240, 255, 0.4)',
                        font: {
                            family: 'Inter',
                            size: 11
                        }
                    },
                    border: {
                        display: false
                    }
                },
                y: {
                    grid: {
                        color: 'rgba(255, 255, 255, 0.04)',
                        drawTicks: false
                    },
                    ticks: {
                        color: 'rgba(240, 240, 255, 0.4)',
                        font: {
                            family: 'Inter',
                            size: 11
                        },
                        stepSize: 10
                    },
                    border: {
                        display: false
                    }
                }
            }
        };

        new Chart(ctx, {
            type: 'bar',
            data: weeklyData,
            options: options
        });
    })();
</script>
