<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth}">
<head>
    <title>Đặt lại mật khẩu</title>
</head>
<body>
<div layout:fragment="auth-content">
    <h1>Đặt lại mật khẩu</h1>
    <p class="subtitle" th:if="${tokenValid}">Tạo mật khẩu mới cho tài khoản của bạn.</p>

    <div th:if="${!tokenValid}">
        <div class="alert alert-danger py-3 px-3 mb-4 border-0 rounded-3 text-start"
             style="font-size: 13px; background: rgba(255, 107, 107, 0.12); color: var(--danger);">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            <span th:text="${errorMessage ?: 'Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.'}"></span>
        </div>
        <a th:href="@{/forgot-password}" class="btn-brand text-center text-decoration-none">Yêu cầu liên kết mới</a>
    </div>

    <form th:if="${tokenValid}" th:action="@{/reset-password(token=${token})}"
          th:object="${resetPasswordRequest}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="mb-3 text-start" th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
            <label for="password" class="form-label">Mật khẩu mới</label>
            <input id="password" type="password" class="form-control" th:field="*{password}"
                   placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" required autofocus>
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="mb-4 text-start" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'has-error'">
            <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
            <input id="confirmPassword" type="password" class="form-control" th:field="*{confirmPassword}"
                   placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" required>
            <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                 th:errors="*{confirmPassword}"></div>
        </div>

        <button type="submit" class="btn-brand">Đặt lại mật khẩu</button>
    </form>

    <div class="auth-footer mt-4">
        <a th:href="@{/login}"><i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập</a>
    </div>
</div>
</body>
</html>
