<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth}">
<head>
    <title>Quên mật khẩu</title>
</head>
<body>
<div layout:fragment="auth-content">
    <h1>Quên mật khẩu?</h1>
    <p class="subtitle">Nhập email tài khoản để nhận liên kết đặt lại mật khẩu.</p>

    <div class="alert alert-success py-2 px-3 mb-3 border-0 rounded-3 text-start"
         style="font-size: 13px; background: rgba(78, 205, 196, 0.12); color: var(--success);"
         th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger py-2 px-3 mb-3 border-0 rounded-3 text-start"
         style="font-size: 13px; background: rgba(255, 107, 107, 0.12); color: var(--danger);"
         th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-4 text-start" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control" th:field="*{email}"
                   placeholder="you@example.com" autocomplete="email" required autofocus>
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <button type="submit" class="btn-brand">Gửi liên kết đặt lại</button>
    </form>

    <div class="auth-footer mt-4">
        <a th:href="@{/login}"><i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập</a>
    </div>
</div>
</body>
</html>
