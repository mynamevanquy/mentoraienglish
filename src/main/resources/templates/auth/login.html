<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth}">
<head>
    <title>Đăng nhập</title>
</head>
<body>
    <div layout:fragment="auth-content">
        <h1>Chào mừng trở lại</h1>
        <p class="subtitle">Đăng nhập để tiếp tục hành trình học tiếng Anh của bạn.</p>

        <!-- Error alert -->
        <div class="alert alert-danger py-2 px-3 mb-3 border-0 rounded-3 text-start d-flex align-items-center gap-2" 
             style="font-size: 13px; background: rgba(255, 107, 107, 0.12); color: var(--danger);" 
             th:if="${param.error}">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>Email hoặc mật khẩu không chính xác. Vui lòng thử lại.</span>
        </div>

        <!-- Logout success alert -->
        <div class="alert alert-success py-2 px-3 mb-3 border-0 rounded-3 text-start d-flex align-items-center gap-2" 
             style="font-size: 13px; background: rgba(78, 205, 196, 0.12); color: var(--success);" 
             th:if="${param.logout}">
            <i class="bi bi-check-circle-fill"></i>
            <span>Bạn đã đăng xuất thành công.</span>
        </div>

        <!-- Session expired alert -->
        <div class="alert alert-danger py-2 px-3 mb-3 border-0 rounded-3 text-start d-flex align-items-center gap-2" 
             style="font-size: 13px; background: rgba(255, 107, 107, 0.12); color: var(--danger);" 
             th:if="${param.expired}">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" th:action="@{/login}" th:method="post" novalidate>
            <!-- CSRF token (automatically injected, but explicitly defined here for safety) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Email Field -->
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Email</label>
                <input type="email" id="username" name="username" class="form-control" 
                       placeholder="you@example.com" autocomplete="email" required />
            </div>

            <!-- Password Field -->
            <div class="mb-4 text-start">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" id="password" name="password" class="form-control" 
                       placeholder="••••••••" autocomplete="current-password" required />
            </div>

            <!-- Remember me & Forgot Password -->
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div class="form-check text-start">
                    <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me" style="accent-color: var(--brand-primary); cursor: pointer;" />
                    <label class="form-check-label text-secondary fs-7" for="rememberMe" style="cursor: pointer;">
                        Ghi nhớ đăng nhập
                    </label>
                </div>
                <a href="#" class="forgot-link text-decoration-none fs-7" style="color: var(--brand-primary);">Quên mật khẩu?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="loginBtn" class="btn-brand">Đăng nhập</button>
        </form>

        <div class="divider">hoặc</div>

        <div class="auth-footer">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký miễn phí</a>
        </div>
    </div>
</body>
</html>
