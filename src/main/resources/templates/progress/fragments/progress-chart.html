<div style="width: 100%; height: 320px; position: relative;" xmlns:th="http://www.thymeleaf.org">
    <canvas id="progressChart"></canvas>
</div>

<script th:inline="javascript">
    (function() {
        const ctx = document.getElementById('progressChart').getContext('2d');
        const chartData = JSON.parse(/*[[${progressChartJson}]]*/ '{}');

        // Add beautiful background gradient under the curve line
        const gradient = ctx.createLinearGradient(0, 0, 0, 300);
        gradient.addColorStop(0, 'rgba(16, 185, 129, 0.25)'); // Emerald 500
        gradient.addColorStop(1, 'rgba(16, 185, 129, 0.00)');

        if (chartData.datasets && chartData.datasets.length > 0) {
            chartData.datasets[0].backgroundColor = gradient;
        }

        const options = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    backgroundColor: '#1E1E30',
                    titleColor: '#F0F0FF',
                    bodyColor: '#A5A5C7',
                    borderColor: 'rgba(255, 255, 255, 0.08)',
                    borderWidth: 1,
                    cornerRadius: 8,
                    padding: 10,
                    displayColors: false
                }
            },
            scales: {
                x: {
                    grid: {
                        color: 'rgba(255, 255, 255, 0.03)',
                        drawTicks: false
                    },
                    ticks: {
                        color: 'rgba(240, 240, 255, 0.4)',
                        font: {
                            family: 'Inter',
                            size: 11
                        }
                    },
                    border: {
                        display: false
                    }
                },
                y: {
                    grid: {
                        color: 'rgba(255, 255, 255, 0.04)',
                        drawTicks: false
                    },
                    ticks: {
                        color: 'rgba(240, 240, 255, 0.4)',
                        font: {
                            family: 'Inter',
                            size: 11
                        }
                    },
                    border: {
                        display: false
                    }
                }
            }
        };

        // If there's an existing chart instance on the canvas, destroy it first
        const existingChart = Chart.getChart('progressChart');
        if (existingChart) {
            existingChart.destroy();
        }

        new Chart(ctx, {
            type: 'line',
            data: chartData,
            options: options
        });
    })();
</script>
