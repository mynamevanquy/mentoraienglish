<div xmlns:th="http://www.thymeleaf.org">
    <!-- No more words -->
    <div th:if="${word == null}" class="dash-card text-center py-5">
        <i class="bi bi-check2-circle display-5 text-success"></i>
        <h2 class="h4 mt-3">Hoàn thành!</h2>
        <p class="vocab-muted mb-3">Bạn đã học hết tất cả từ vựng trong cấp độ này.</p>
        <a class="btn btn-outline-light" th:href="@{/vocabulary/learn}">
            <i class="bi bi-arrow-left"></i> Chọn cấp độ khác
        </a>
    </div>

    <!-- Word card -->
    <article th:if="${word != null}" class="dash-card mx-auto" style="max-width: 720px;">
        <div class="text-center mb-2">
            <span class="badge bg-success"><i class="bi bi-check-circle"></i> Đã lưu vào danh sách</span>
        </div>

        <div class="text-center mb-4">
            <div class="vocab-muted mb-2" th:text="${word.pronunciation ?: ''}"></div>
            <h2 class="display-5 fw-bold" th:text="${word.word}">word</h2>
            <span class="badge bg-secondary mb-2" th:text="${word.partOfSpeech}">noun</span>
            <p class="lead mb-1" th:text="${word.definitionEn}">Definition</p>
            <p class="vocab-muted mb-0" th:text="${word.definitionVi}">Nghĩa</p>
        </div>

        <!-- Examples -->
        <div th:if="${word.examples != null && !word.examples.isEmpty()}" class="mb-4">
            <h6 class="text-uppercase small vocab-muted mb-2">Ví dụ</h6>
            <div th:each="ex : ${word.examples}" class="mb-2">
                <p class="mb-0 fst-italic" th:text="${ex.get('en') ?: ex.get('sentence') ?: ''}">Example sentence</p>
                <p class="vocab-muted small mb-0" th:text="${ex.get('vi') ?: ex.get('translation') ?: ''}">Translation</p>
            </div>
        </div>

        <!-- Synonyms & Antonyms -->
        <div class="row mb-4" th:if="${(word.synonyms != null && !word.synonyms.isEmpty()) || (word.antonyms != null && !word.antonyms.isEmpty())}">
            <div class="col-6" th:if="${word.synonyms != null && !word.synonyms.isEmpty()}">
                <h6 class="text-uppercase small vocab-muted mb-2">Từ đồng nghĩa</h6>
                <div>
                    <span th:each="s : ${word.synonyms}" class="badge bg-dark me-1 mb-1" th:text="${s}">syn</span>
                </div>
            </div>
            <div class="col-6" th:if="${word.antonyms != null && !word.antonyms.isEmpty()}">
                <h6 class="text-uppercase small vocab-muted mb-2">Từ trái nghĩa</h6>
                <div>
                    <span th:each="a : ${word.antonyms}" class="badge bg-dark me-1 mb-1" th:text="${a}">ant</span>
                </div>
            </div>
        </div>

        <!-- Next button -->
        <div class="d-flex justify-content-center">
            <button class="btn btn-primary btn-lg"
                    th:attr="hx-get=@{/vocabulary/learn/session(level=${level})}"
                    hx-target="#learn-area"
                    hx-swap="innerHTML">
                <i class="bi bi-arrow-right"></i> Từ tiếp theo
            </button>
        </div>

        <div class="text-center mt-3">
            <small class="vocab-muted">Từ này đã được lưu vào danh sách để ôn tập sau</small>
        </div>
    </article>
</div>
