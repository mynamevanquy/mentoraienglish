<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Luyện thêm từ vựng</title>
    <style>
        .level-btn.active {
            background: var(--brand-primary);
            border-color: var(--brand-primary);
            color: #fff;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <header class="mb-4">
        <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 4px;">Luyện thêm từ vựng</h1>
        <p class="vocab-muted mb-0">Chỉ dùng khi đã hoàn thành các từ đến hạn; phần này không thay thế lịch ôn chính.</p>
    </header>

    <!-- Level selector -->
    <div class="d-flex gap-2 mb-4 flex-wrap" id="level-selector">
        <button class="btn btn-outline-light level-btn active"
                hx-get="/vocabulary/review/random/next"
                hx-target="#review-area"
                hx-swap="innerHTML"
                onclick="setActive(this)">
            <i class="bi bi-shuffle"></i> Tất cả
        </button>
        <button class="btn btn-outline-light level-btn"
                th:attr="hx-get=@{/vocabulary/review/random/next(level=BEGINNER)}"
                hx-target="#review-area"
                hx-swap="innerHTML"
                onclick="setActive(this)">
            Cơ bản
        </button>
        <button class="btn btn-outline-light level-btn"
                th:attr="hx-get=@{/vocabulary/review/random/next(level=INTERMEDIATE)}"
                hx-target="#review-area"
                hx-swap="innerHTML"
                onclick="setActive(this)">
            Trung cấp
        </button>
        <button class="btn btn-outline-light level-btn"
                th:attr="hx-get=@{/vocabulary/review/random/next(level=ADVANCED)}"
                hx-target="#review-area"
                hx-swap="innerHTML"
                onclick="setActive(this)">
            Nâng cao
        </button>
    </div>

    <div id="review-area"
         hx-get="/vocabulary/review/random/next"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="dash-card text-center py-5">
            <div class="spinner-border spinner-border-sm text-light"></div>
            <span class="ms-2 vocab-muted">Đang tải...</span>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        function setActive(btn) {
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</th:block>
</body>
</html>
