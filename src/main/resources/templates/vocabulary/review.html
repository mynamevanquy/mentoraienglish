<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Ôn tập từ vựng</title>
    <style>
        .vocab-muted {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <header class="d-flex justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Ôn tập từ vựng</h1>
            <p class="vocab-muted mb-0">
                Có <strong th:text="${dueCount}">0</strong> từ đến hạn. Hãy tự nhớ nghĩa trước khi mở đáp án.
            </p>
        </div>
        <div class="d-flex gap-2 flex-shrink-0">
            <a class="btn btn-outline-light" th:href="@{/vocabulary/review/random}">
                <i class="bi bi-shuffle"></i> Luyện thêm
            </a>
            <a class="btn btn-outline-light" th:href="@{/vocabulary}">
                <i class="bi bi-arrow-left"></i> Danh sách từ vựng
            </a>
        </div>
    </header>

    <section id="review-area"
             hx-get="/vocabulary/review/next"
             hx-trigger="load"
             hx-swap="innerHTML">
        <div class="dash-card text-center py-5">Đang tải thẻ tiếp theo...</div>
    </section>
</div>
</body>
</html>
