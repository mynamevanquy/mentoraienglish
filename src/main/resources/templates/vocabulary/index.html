<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Từ vựng</title>
    <style>
        .vocab-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .vocab-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .vocab-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin: 0;
        }

        .vocab-shell {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 24px;
        }

        .vocab-search {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 190px auto;
            gap: 12px;
            margin-bottom: 20px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .vocab-card {
            min-height: 220px;
        }

        @media (min-width: 768px) {
            .vocab-card.expanded-card {
                grid-column: span 2;
            }
        }

        .vocab-word {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .vocab-muted {
            color: var(--text-secondary);
        }

        @media (max-width: 992px) {
            .vocab-header,
            .vocab-search {
                grid-template-columns: 1fr;
                flex-direction: column;
            }

            .vocab-shell {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <header class="vocab-header">
        <div>
            <h1 class="vocab-title">Từ vựng</h1>
            <p class="vocab-subtitle">Tìm kiếm, lưu trữ và ôn tập từ vựng bằng phương pháp lặp lại ngắt quãng.</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-primary" th:href="@{/vocabulary/learn}">
                <i class="bi bi-lightning-charge"></i> Học mới
            </a>
            <a class="btn btn-outline-light" th:href="@{/vocabulary/review}">
                <i class="bi bi-arrow-repeat"></i> Ôn tập
            </a>
            <a class="btn btn-outline-light" th:href="@{/vocabulary/statistics}">
                <i class="bi bi-graph-up"></i> Thống kê
            </a>
            <a class="btn btn-outline-light" th:href="@{/vocabulary/levels}">
                <i class="bi bi-layer-group"></i> Theo cấp độ
            </a>
        </div>
    </header>

    <div class="vocab-shell">
        <section class="dash-card">
            <form class="vocab-search"
                  th:action="@{/vocabulary}"
                  th:method="get"
                  hx-get="/vocabulary/list"
                  hx-target="#vocabulary-list"
                  hx-swap="innerHTML">
                <input class="form-control"
                       type="search"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="Tìm kiếm từ vựng...">
                <select class="form-select" name="level">
                    <option value="">Tất cả cấp độ</option>
                    <option th:each="level : ${levels}"
                            th:value="${level.name()}"
                            th:selected="${selectedLevel == level.name()}"
                            th:text="${level.name()}">BEGINNER</option>
                </select>
                <button class="btn btn-outline-light" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <div id="vocabulary-list">
                <div th:if="${vocabularies == null or vocabularies.isEmpty()}" class="text-center py-5 vocab-muted">
                    Không tìm thấy từ vựng nào. (debug: <span th:text="${vocabularies}">null</span>)
                </div>
                <div th:if="${vocabularies != null and !vocabularies.isEmpty()}" class="vocab-grid">
                    <div th:each="v : ${vocabularies.content}">
                        <div th:replace="~{vocabulary/fragments/vocabulary-card :: summary(${v})}"></div>
                    </div>
                </div>
                <div class="mt-4" th:if="${vocabularies != null and vocabularies.totalPages > 1}"
                     th:replace="~{fragments/pagination :: pagination(${vocabularies.number}, ${vocabularies.totalPages}, ${listBaseUrl}, '#vocabulary-list')}">
                </div>
            </div>
        </section>

        <aside class="dash-card">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h2 class="h6 mb-0">Tiến trình thành thạo</h2>
                <i class="bi bi-pie-chart vocab-muted"></i>
            </div>
            <div id="vocabulary-stats"
                 hx-get="/vocabulary/stats"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="vocab-muted">Đang tải số liệu thống kê...</div>
            </div>
        </aside>
    </div>
</div>
</body>
</html>
