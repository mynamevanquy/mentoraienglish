<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title layout:title-pattern="$LAYOUT_TITLE — $CONTENT_TITLE">MentorAI English</title>
    <meta name="description" content="MentorAI English — Nền tảng học tiếng Anh thông minh ứng dụng AI." />
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon.png}" />
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- HTMX and Chart.js -->
    <script src="https://unpkg.com/htmx.org@1.9.10" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous"></script>

    <!-- CSRF Meta Token for HTMX -->
    <meta name="csrf-token" th:content="${_csrf.token}" />
    <meta name="csrf-header" th:content="${_csrf.headerName}" />
    <meta name="hx-headers" th:if="${_csrf != null}"
        th:content="${'{&quot;' + _csrf.headerName + '&quot;:&quot;' + _csrf.token + '&quot;}'}" />

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --brand-primary: #6C63FF;
            --brand-secondary: #4ECDC4;
            --brand-gradient: linear-gradient(135deg, #6C63FF 0%, #4ECDC4 100%);
            --surface: #0A0A12;
            --surface-card: rgba(255, 255, 255, 0.04);
            --surface-border: rgba(255, 255, 255, 0.06);
            --text-primary: #F0F0FF;
            --text-secondary: rgba(240, 240, 255, 0.6);
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 80px;
            --radius-lg: 20px;
            --radius-md: 12px;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--surface);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background glow */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.06;
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            width: 600px;
            height: 600px;
            background: var(--brand-primary);
            top: -200px;
            left: -200px;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: var(--brand-secondary);
            bottom: -150px;
            right: -150px;
        }

        /* Main structure layout */
        .app-layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin-left: var(--sidebar-width);
            transition: var(--transition-smooth);
            min-width: 0;
            /* Prevents overflow issues */
        }

        .main-wrapper.collapsed {
            margin-left: var(--sidebar-collapsed-width);
        }

        .app-content {
            flex-grow: 1;
            padding: 32px 24px;
            overflow-y: auto;
        }

        /* Responsive adjustments */
        @media (max-width: 992px) {
            .main-wrapper {
                margin-left: 0 !important;
            }

            .app-content {
                padding: 24px 16px;
            }
        }

        /* Reusable UI classes */
        .dash-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 24px;
            position: relative;
            transition: var(--transition-smooth);
        }

        .dash-card:hover {
            border-color: rgba(108, 99, 255, 0.2);
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Loading indicator styling */
        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator {
            display: inline-block;
        }

        .htmx-request.htmx-indicator {
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <!-- Collapsible Sidebar Fragment -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="main-wrapper" id="mainWrapper">
            <!-- Navbar Fragment -->
            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <!-- App Content Injection Slot -->
            <main class="app-content">
                <div layout:fragment="content">
                    <!-- Specific view content will replace this -->
                </div>
            </main>

            <!-- Reusable minimal Footer fragment -->
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <!-- Reusable Toast notifications system -->
    <div th:replace="~{fragments/toast :: toast}"></div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

    <!-- Global HTMX & UI Interactions JavaScript -->
    <script>
        // 1. Inject CSRF Token into every HTMX Request Header
        document.addEventListener('htmx:configRequest', function (e) {
            const csrfMeta = document.querySelector('meta[name="csrf-token"]');
            const csrfHeader = document.querySelector('meta[name="csrf-header"]');
            if (csrfMeta && csrfHeader && csrfMeta.content && csrfHeader.content) {
                e.detail.headers[csrfHeader.content] = csrfMeta.content;
            }
        });

        // 2. Responsive mobile sidebar toggle support
        function toggleSidebar() {
            const sidebar = document.getElementById('appSidebar');
            const mainWrapper = document.getElementById('mainWrapper');
            if (sidebar) {
                sidebar.classList.toggle('collapsed');
            }
            if (mainWrapper) {
                mainWrapper.classList.toggle('collapsed');
            }
        }

        // 3. Auto-close mobile sidebar drawer on overlay click
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('appSidebar');
            if (window.innerWidth <= 992 && sidebar) {
                sidebar.classList.add('collapsed');
            }
        });
    </script>

    <!-- Per-page scripts slot -->
    <th:block layout:fragment="scripts"></th:block>
</body>

</html>
