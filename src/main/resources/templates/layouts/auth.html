<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title layout:title-pattern="$LAYOUT_TITLE — $CONTENT_TITLE">MentorAI English</title>
    <meta name="description" content="MentorAI English — Nền tảng học tiếng Anh thông minh ứng dụng AI hàng đầu." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10" crossorigin="anonymous"></script>
    <meta name="csrf-token" th:content="${_csrf.token}" />
    <meta name="csrf-header" th:content="${_csrf.headerName}" />
    <meta name="hx-headers"
          th:if="${_csrf != null}"
          th:content="${'{&quot;' + _csrf.headerName + '&quot;:&quot;' + _csrf.token + '&quot;}'}" />
    
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --brand-primary: #6C63FF;
            --brand-secondary: #4ECDC4;
            --brand-gradient: linear-gradient(135deg, #6C63FF 0%, #4ECDC4 100%);
            --surface: #0F0F1A;
            --surface-card: rgba(255, 255, 255, 0.05);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text-primary: #F0F0FF;
            --text-secondary: rgba(240, 240, 255, 0.55);
            --danger: #FF6B6B;
            --success: #4ECDC4;
            --input-bg: rgba(255, 255, 255, 0.06);
            --input-focus: rgba(108, 99, 255, 0.25);
            --radius: 14px;
            --shadow-card: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--surface);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background blobs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: blob 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: var(--brand-primary);
            top: -150px;
            left: -150px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: var(--brand-secondary);
            bottom: -100px;
            right: -100px;
            animation-delay: -4s;
        }

        @keyframes blob {
            0% {
                transform: scale(1) translate(0, 0);
            }
            100% {
                transform: scale(1.2) translate(30px, 20px);
            }
        }

        .auth-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 36px;
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.5s ease forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            justify-content: center;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--brand-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 28px;
            text-align: center;
        }

        /* Fields style */
        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-control {
            background: var(--input-bg) !important;
            border: 1px solid var(--surface-border) !important;
            border-radius: 10px !important;
            padding: 12px 16px !important;
            font-size: 14px !important;
            color: var(--text-primary) !important;
            transition: border-color 0.2s, box-shadow 0.2s !important;
        }

        .form-control:focus {
            border-color: var(--brand-primary) !important;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15) !important;
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(240, 240, 255, 0.25) !important;
        }

        /* Custom buttons styling */
        .btn-brand {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--brand-gradient);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.35);
        }

        .btn-brand:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(108, 99, 255, 0.45);
        }

        .btn-brand:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--surface-border);
        }

        .auth-footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .auth-footer a:hover {
            opacity: 0.75;
        }

        .field-error {
            font-size: 12px;
            color: var(--danger);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .has-error input {
            border-color: rgba(255, 107, 107, 0.6) !important;
            background: rgba(255, 107, 107, 0.08) !important;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">🎓</div>
            <span class="logo-text">MentorAI English</span>
        </div>

        <div layout:fragment="auth-content">
            <!-- Child pages login/register fill this -->
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('htmx:configRequest', function(e) {
            const csrfMeta = document.querySelector('meta[name="csrf-token"]');
            const csrfHeader = document.querySelector('meta[name="csrf-header"]');
            if (csrfMeta && csrfHeader && csrfMeta.content && csrfHeader.content) {
                e.detail.headers[csrfHeader.content] = csrfMeta.content;
            }
        });
    </script>
</body>
</html>
