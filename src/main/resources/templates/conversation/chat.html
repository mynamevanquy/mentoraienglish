<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Chat</title>
    <style>
        .chat-section {
            height: 75vh;
            display: flex;
            flex-direction: column;
        }
        .message-list {
            overflow-y: auto;
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        /* User bubble */
        .bubble-user {
            background: linear-gradient(135deg, rgba(108, 99, 255, 0.2) 0%, rgba(108, 99, 255, 0.08) 100%);
            border: 1px solid rgba(108, 99, 255, 0.25);
        }

        /* Assistant bubble */
        .bubble-assistant {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Error bubble */
        .bubble-error {
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.25);
            color: rgba(240, 240, 255, 0.85);
        }

        /* Correction item */
        .correction-item {
            background: rgba(108, 99, 255, 0.06);
        }

        /* Message content preserves newlines without affecting inner components */
        .message-content {
            white-space: pre-line;
        }

        /* Vocabulary badge */
        .vocab-badge {
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.2) 0%, rgba(78, 205, 196, 0.1) 100%);
            border: 1px solid rgba(78, 205, 196, 0.3);
            color: #4ECDC4;
            font-weight: 500;
        }

        /* Text colors */
        .text-purple { color: #6C63FF; }
        .text-purple-light { color: #a99bff; }
        .text-teal { color: #4ECDC4; }

        /* Chat input area */
        .chat-input-area {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px;
        }
        .chat-input-area textarea {
            background: transparent;
            border: none;
            color: var(--text-primary);
            resize: none;
        }
        .chat-input-area textarea:focus {
            box-shadow: none;
            background: transparent;
            color: var(--text-primary);
        }
        .chat-input-area textarea::placeholder {
            color: rgba(240, 240, 255, 0.3);
        }
        .btn-send {
            background: linear-gradient(135deg, #6C63FF 0%, #4ECDC4 100%);
            border: none;
            color: #fff;
            border-radius: 12px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
            color: #fff;
        }
        .btn-send:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: none;
        }

        /* Typing dots animation */
        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ECDC4;
            display: inline-block;
            animation: typingBounce 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Chat header */
        .chat-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 16px;
        }
        .btn-back {
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .btn-back:hover {
            border-color: rgba(108, 99, 255, 0.3);
            color: var(--text-primary);
            background: rgba(108, 99, 255, 0.1);
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <section class="dash-card chat-section">
        <!-- Header -->
        <header class="d-flex justify-content-between align-items-start gap-3 mb-3 flex-shrink-0 chat-header">
            <div>
                <h1 id="chat-title" class="fs-4 fw-bold mb-1" th:text="${conversation.title}">Chat</h1>
                <p class="mb-0" style="color: rgba(240, 240, 255, 0.45);">
                    <i class="bi bi-robot me-1 text-teal"></i> Gia sư tiếng Anh Aria
                    <span th:if="${conversation.tokenWarning}" class="text-warning ms-2">
                        <i class="bi bi-exclamation-circle me-1"></i>dung lượng token đã sử dụng trên 80%
                    </span>
                </p>
            </div>
            <a class="btn btn-back" th:href="@{/conversation}">
                <i class="bi bi-arrow-left"></i> Danh sách
            </a>
        </header>

        <!-- Messages -->
        <div id="message-list" class="message-list mb-3">
            <div th:if="${conversation.messages == null || conversation.messages.isEmpty()}" class="text-center py-5">
                <div class="mb-3">
                    <i class="bi bi-chat-heart display-4" style="color: rgba(108, 99, 255, 0.4);"></i>
                </div>
                <h2 class="h5 text-light mb-2">Bắt đầu nhập lời thoại</h2>
                <p style="color: rgba(240, 240, 255, 0.4); max-width: 400px; margin: 0 auto;">
                    Hãy yêu cầu Aria luyện tập giao tiếp, kiểm tra ngữ pháp hoặc đóng vai một cuộc phỏng vấn.
                </p>
            </div>
            <div th:each="chatEntry : ${conversation.messages}"
                 th:classappend="${chatEntry.role != null && chatEntry.role.name() == 'USER'} ? ' justify-content-end' : ' justify-content-start'"
                 class="d-flex">
                <div th:classappend="${chatEntry.role != null && chatEntry.role.name() == 'USER'} ? ' bubble-user' : ' bubble-assistant'"
                     class="rounded-4 p-2" style="max-width: min(760px, 86%); width: fit-content; overflow-wrap: break-word;">
                    <div class="small fw-semibold mb-1"
                         th:classappend="${chatEntry.role != null && chatEntry.role.name() == 'USER'} ? ' text-purple-light' : ' text-teal'"
                         th:text="${chatEntry.role != null && chatEntry.role.name() == 'USER'} ? 'Bạn' : 'Aria'">Aria</div>
                    <div class="message-content" th:text="${chatEntry.content}">Message content</div>
                    <div th:if="${chatEntry.corrections != null && !chatEntry.corrections.isEmpty()}"
                         th:replace="~{conversation/fragments/correction-panel :: corrections(${chatEntry.corrections})}">
                    </div>
                    <div th:if="${chatEntry.vocabularySuggestions != null && !chatEntry.vocabularySuggestions.isEmpty()}"
                         class="border-top mt-3 pt-3" style="border-color: rgba(78, 205, 196, 0.2) !important;">
                        <div class="small fw-semibold text-teal mb-2">
                            <i class="bi bi-lightbulb me-1"></i> Gợi ý từ vựng
                        </div>
                        <div class="d-flex flex-wrap gap-2">
                            <span class="badge vocab-badge"
                                  th:each="suggestion : ${chatEntry.vocabularySuggestions}"
                                  th:text="${suggestion}">word</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Typing indicator + Input form -->
        <div style="flex-shrink: 0; padding-top: 8px;">
            <div th:replace="~{conversation/fragments/typing-indicator :: indicator}"></div>
            <form class="d-flex gap-2 align-items-end chat-input-area"
                  th:action="@{/conversation/{id}/message(id=${conversation.id})}"
                  th:method="post"
                  th:attr="hx-post=@{/conversation/{id}/message(id=${conversation.id})}"
                  hx-target="#message-list"
                  hx-swap="beforeend"
                  hx-indicator="#typing-indicator">
                <textarea class="form-control border-0"
                          name="message"
                          rows="2"
                          required
                          placeholder="Nhập tin nhắn bằng tiếng Anh..."
                          style="resize: none;"></textarea>
                <button class="btn-send flex-shrink-0" type="submit">
                    <i class="bi bi-send"></i>
                </button>
            </form>
        </div>
    </section>

    <script>
        function scrollChatToBottom() {
            const list = document.getElementById('message-list');
            if (list) list.scrollTop = list.scrollHeight;
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Normalize existing AI message content on load
            document.querySelectorAll('.message-content').forEach(function (el) {
                el.textContent = el.textContent.replace(/\n{2,}/g, '\n').trim();
            });
            scrollChatToBottom();
        });

        // Show user bubble before request
        document.body.addEventListener('htmx:beforeRequest', function (event) {
            if (!event.detail.elt || !event.detail.elt.tagName || event.detail.elt.tagName !== 'FORM') return;
            const textarea = event.detail.elt.querySelector('textarea[name="message"]');
            const list = document.getElementById('message-list');
            if (!textarea || !list || !textarea.value.trim()) return;

            const emptyState = list.querySelector('.text-center');
            if (emptyState) emptyState.remove();

            const escaped = textarea.value.trim()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            list.insertAdjacentHTML('beforeend',
                '<div class="d-flex justify-content-end">' +
                '<div class="rounded-4 p-2 bubble-user" style="max-width: min(760px, 86%); width: fit-content; overflow-wrap: break-word;">' +
                '<div class="small fw-semibold mb-1 text-purple-light">Bạn</div>' +
                '<div class="message-content">' + escaped + '</div>' +
                '</div></div>');
            textarea.value = '';
            scrollChatToBottom();
        });

        // Normalize AI message content: collapse 2+ newlines to 1
        document.body.addEventListener('htmx:afterSwap', function (event) {
            if (event.detail.target && event.detail.target.id === 'message-list') {
                // Normalize message content
                event.detail.target.querySelectorAll('.bubble-assistant .message-content, .bubble-user .message-content').forEach(function (el) {
                    el.textContent = el.textContent.replace(/\n{2,}/g, '\n').trim();
                });
                var textarea = document.querySelector('textarea[name="message"]');
                if (textarea) textarea.value = '';
                scrollChatToBottom();
            }
        });

        // Network errors
        document.body.addEventListener('htmx:responseError', function (event) {
            document.getElementById('message-list')?.insertAdjacentHTML('beforeend',
                '<div class="d-flex justify-content-start">' +
                '<div class="rounded-4 p-2 bubble-error" style="max-width: min(760px, 86%); width: fit-content; overflow-wrap: break-word;">' +
                '<div class="small fw-semibold mb-1" style="color: #ff6b6b;"><i class="bi bi-exclamation-triangle me-1"></i> Lỗi kết nối</div>' +
                '<div>Không thể kết nối đến máy chủ. Vui lòng kiểm tra mạng và thử lại.</div>' +
                '</div></div>');
            scrollChatToBottom();
        });

        document.body.addEventListener('htmx:sendError', function (event) {
            document.getElementById('message-list')?.insertAdjacentHTML('beforeend',
                '<div class="d-flex justify-content-start">' +
                '<div class="rounded-4 p-2 bubble-error" style="max-width: min(760px, 86%); width: fit-content; overflow-wrap: break-word;">' +
                '<div class="small fw-semibold mb-1" style="color: #ff6b6b;"><i class="bi bi-exclamation-triangle me-1"></i> Lỗi gửi tin nhắn</div>' +
                '<div>Không thể gửi tin nhắn. Vui lòng thử lại.</div>' +
                '</div></div>');
            scrollChatToBottom();
        });

        // Disable button while waiting
        document.body.addEventListener('htmx:beforeSend', function (event) {
            if (!event.detail.elt) return;
            const btn = event.detail.elt.querySelector('.btn-send');
            if (btn) btn.disabled = true;
        });

        document.body.addEventListener('htmx:afterOnLoad', function () {
            document.querySelectorAll('.btn-send').forEach(function (btn) {
                btn.disabled = false;
            });
        });

        // Submit on Enter (Shift+Enter for new line)
        document.addEventListener('keydown', function (event) {
            if (event.target.tagName === 'TEXTAREA' && event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                const form = event.target.closest('form');
                if (form) form.requestSubmit();
            }
        });

        // Dynamic title update when the first message is sent
        document.body.addEventListener('conversationTitleUpdated', function (event) {
            const newTitle = event.detail.value || event.detail;
            const titleEl = document.getElementById('chat-title');
            if (titleEl && newTitle) {
                titleEl.textContent = newTitle;
            }
            document.title = newTitle;
        });
    </script>
</div>
</body>
</html>
