<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="corrections(corrections)"
     class="border-top mt-2 pt-2" style="border-color: rgba(108, 99, 255, 0.15) !important;">
    <div class="small fw-semibold text-purple-light mb-1">
        <i class="bi bi-pencil-square me-1"></i> Sửa lỗi ngữ pháp & diễn đạt
    </div>
    <div class="d-grid gap-2">
        <div th:each="correction : ${corrections}" class="small correction-item rounded-2 p-2">
            <div th:if="${correction.original}">
                <span class="text-decoration-line-through" style="color: rgba(240, 240, 255, 0.4);" th:text="${correction.original}">original</span>
                <i class="bi bi-arrow-right mx-2 text-purple"></i>
                <span class="fw-semibold text-light" th:text="${correction.corrected}">corrected</span>
            </div>
            <div class="mt-1" style="color: rgba(240, 240, 255, 0.55);" th:text="${correction.explanation}">Explanation</div>
        </div>
    </div>
</div>
