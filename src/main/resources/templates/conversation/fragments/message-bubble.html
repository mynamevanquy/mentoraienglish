<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="bubble(msg)"
     th:classappend="${msg.role != null && msg.role.name() == 'USER'} ? ' justify-content-end' : ' justify-content-start'"
     class="d-flex">
    <div th:classappend="${msg.role != null && msg.role.name() == 'USER'} ? ' bubble-user' : ' bubble-assistant'"
         class="rounded-4 p-2" style="max-width: min(760px, 86%); width: fit-content; overflow-wrap: break-word;">
        <div class="small fw-semibold mb-1"
             th:classappend="${msg.role != null && msg.role.name() == 'USER'} ? ' text-purple-light' : ' text-teal'"
             th:text="${msg.role != null && msg.role.name() == 'USER'} ? 'Bạn' : 'Aria'">Aria</div>
        <div class="message-content" th:text="${msg.content}">Message content</div>

        <div th:if="${msg.corrections != null && !msg.corrections.isEmpty()}"
             th:replace="~{conversation/fragments/correction-panel :: corrections(${msg.corrections})}">
        </div>

        <div th:if="${msg.vocabularySuggestions != null && !msg.vocabularySuggestions.isEmpty()}"
             class="border-top mt-3 pt-3" style="border-color: rgba(78, 205, 196, 0.2) !important;">
            <div class="small fw-semibold text-teal mb-2">
                <i class="bi bi-lightbulb me-1"></i> Gợi ý từ vựng
            </div>
            <div class="d-flex flex-wrap gap-2">
                <span class="badge vocab-badge"
                      th:each="suggestion : ${msg.vocabularySuggestions}"
                      th:text="${suggestion}">word</span>
            </div>
        </div>
    </div>
</div>
