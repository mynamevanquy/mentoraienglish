<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Trò chuyện AI</title>
    <style>
        .conv-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .conv-card:hover {
            border-color: rgba(108, 99, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.1);
        }
        .conv-card a {
            color: var(--text-primary);
        }
        .conv-card a:hover {
            color: #fff;
        }
        .conv-title {
            color: var(--text-primary);
            transition: color 0.2s;
        }
        .conv-card:hover .conv-title {
            color: #a99bff;
        }
        .conv-preview {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: rgba(240, 240, 255, 0.4);
            line-height: 1.5;
        }
        .conv-meta {
            color: rgba(240, 240, 255, 0.3);
            font-size: 0.8rem;
        }
        .conv-meta i {
            color: #4ECDC4;
        }
        .btn-archive {
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(240, 240, 255, 0.3);
            border-radius: 8px;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .btn-archive:hover {
            border-color: rgba(255, 107, 107, 0.4);
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.08);
        }
        .btn-new-chat {
            background: linear-gradient(135deg, #6C63FF 0%, #4ECDC4 100%);
            border: none;
            color: #fff;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-new-chat:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
            color: #fff;
        }
        .chat-start-card {
            margin-bottom: 24px;
        }
        .chat-start-form {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px;
        }
        .chat-start-form textarea {
            background: transparent;
            border: none;
            color: var(--text-primary);
            resize: none;
            min-height: 72px;
        }
        .chat-start-form textarea:focus {
            background: transparent;
            color: var(--text-primary);
            box-shadow: none;
        }
        .chat-start-form textarea::placeholder {
            color: rgba(240, 240, 255, 0.3);
        }
        .btn-send-chat {
            background: linear-gradient(135deg, #6C63FF 0%, #4ECDC4 100%);
            border: none;
            color: #fff;
            border-radius: 12px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .btn-send-chat:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
            color: #fff;
        }
        .prompt-chip {
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(240, 240, 255, 0.65);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .prompt-chip:hover {
            border-color: rgba(78, 205, 196, 0.35);
            color: #4ECDC4;
            background: rgba(78, 205, 196, 0.08);
        }
        .empty-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(108, 99, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        .empty-icon i {
            font-size: 2rem;
            color: rgba(108, 99, 255, 0.5);
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <header class="d-flex justify-content-between align-items-start gap-3 mb-4 flex-wrap">
        <div>
            <h1 class="fs-2 fw-bold mb-1">Trò chuyện với AI</h1>
            <p style="color: rgba(240, 240, 255, 0.4); margin-bottom: 0;">
                Luyện tập tiếng Anh cùng Aria, gia sư AI của bạn.
            </p>
        </div>
        <form th:action="@{/conversation/new}" th:method="post">
            <button class="btn btn-new-chat px-3" type="submit">
                <i class="bi bi-plus-lg"></i> Cuộc trò chuyện trống
            </button>
        </form>
    </header>

    <section class="dash-card chat-start-card">
        <div class="d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-robot text-teal"></i>
            <h2 class="h5 mb-0">Bắt đầu luyện nói với Aria</h2>
        </div>
        <form class="d-flex gap-2 align-items-end chat-start-form"
              th:action="@{/conversation/start}"
              th:method="post">
            <textarea class="form-control"
                      id="start-message"
                      name="message"
                      rows="2"
                      required
                      placeholder="Nhập tin nhắn đầu tiên bằng tiếng Anh..."></textarea>
            <button class="btn-send-chat flex-shrink-0" type="submit" aria-label="Gửi tin nhắn">
                <i class="bi bi-send"></i>
            </button>
        </form>
        <div class="d-flex flex-wrap gap-2 mt-3" aria-label="Gợi ý bắt đầu">
            <button class="prompt-chip" type="button" data-prompt="Can we practice a job interview in English?">
                Phỏng vấn
            </button>
            <button class="prompt-chip" type="button" data-prompt="Please correct my grammar while we talk about travel.">
                Sửa ngữ pháp
            </button>
            <button class="prompt-chip" type="button" data-prompt="Let's practice daily English conversation.">
                Giao tiếp hằng ngày
            </button>
        </div>
    </section>

    <!-- Empty state -->
    <section th:if="${conversations.isEmpty()}" class="dash-card text-center py-5">
        <div class="empty-icon mb-3">
            <i class="bi bi-chat-dots"></i>
        </div>
        <h2 class="h5 text-light mb-2">Chưa có cuộc trò chuyện nào</h2>
        <p style="color: rgba(240, 240, 255, 0.4); max-width: 400px; margin: 0 auto;">
            Bắt đầu trò chuyện để thực hành chào hỏi, ngữ pháp, phỏng vấn hoặc giao tiếp hàng ngày.
        </p>
    </section>

    <!-- Conversation grid -->
    <section th:if="${!conversations.isEmpty()}" class="row g-3">
        <div th:each="conversation : ${conversations.content}" class="col-12 col-md-6 col-lg-4">
            <article class="dash-card h-100 conv-card d-flex flex-column">
                <a class="text-decoration-none d-block mb-3 flex-grow-1" th:href="@{/conversation/{id}(id=${conversation.id})}">
                    <div class="d-flex justify-content-between gap-2 mb-2">
                        <h2 class="h6 mb-0 conv-title" th:text="${conversation.title}">Conversation</h2>
                        <i class="bi bi-arrow-up-right" style="color: rgba(240, 240, 255, 0.3);"></i>
                    </div>
                    <p class="conv-preview small mb-3" th:text="${conversation.lastMessagePreview}">Preview</p>
                    <div class="d-flex justify-content-between conv-meta">
                        <span><i class="bi bi-cpu me-1"></i><span th:text="${conversation.totalTokensUsed + ' token'}">0 tokens</span></span>
                        <span><i class="bi bi-clock me-1"></i><span th:text="${conversation.updatedAt}">Updated</span></span>
                    </div>
                </a>
                <button class="btn btn-sm btn-archive w-100"
                        type="button"
                        th:attr="hx-delete=@{/conversation/{id}(id=${conversation.id})}"
                        hx-confirm="Lưu trữ cuộc trò chuyện này?"
                        hx-target="closest .col-12"
                        hx-swap="outerHTML swap:300ms">
                    <i class="bi bi-archive"></i> Lưu trữ
                </button>
            </article>
        </div>
    </section>

    <script>
        document.addEventListener('click', function (event) {
            const chip = event.target.closest('[data-prompt]');
            if (!chip) return;

            const textarea = document.getElementById('start-message');
            if (!textarea) return;

            textarea.value = chip.getAttribute('data-prompt');
            textarea.focus();
        });
    </script>
</div>
</body>
</html>
