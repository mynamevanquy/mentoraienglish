<div th:fragment="toast" class="toast-container app-toast-root position-fixed top-0 end-0 p-3" xmlns:th="http://www.thymeleaf.org">
    <style>
        .custom-toast {
            background: rgba(20, 20, 30, 0.9);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            padding: 16px;
            gap: 12px;
            min-width: 300px;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .app-toast-root {
            z-index: 2000;
        }

        .toast-status-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .toast-type-success {
            border-left: 4px solid var(--brand-secondary) !important;
        }

        .toast-type-success .toast-status-icon {
            color: var(--brand-secondary);
        }

        .toast-type-danger {
            border-left: 4px solid var(--danger) !important;
        }

        .toast-type-danger .toast-status-icon {
            color: var(--danger);
        }

        .toast-body-text {
            font-size: 14px;
            font-weight: 500;
            flex-grow: 1;
        }

        .toast-close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .toast-close-btn:hover {
            color: var(--text-primary);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%) translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateX(0) translateY(0);
                opacity: 1;
            }
        }
    </style>

    <div id="toastContainer"></div>

    <script>
        // Global listener for showToast custom event triggered via HTMX HX-Trigger
        document.addEventListener('showToast', function(e) {
            const detail = e.detail;
            const message = detail.message || 'Thông báo mới!';
            const type = detail.type || 'success'; // 'success' or 'danger'
            
            showAppToast(message, type);
        });

        function showAppToast(message, type) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            // Generate elements
            const toastId = 'toast_' + Date.now();
            const toast = document.createElement('div');
            toast.id = toastId;
            toast.className = `custom-toast toast-type-${type} mb-3`;
            
            const icon = type === 'success' ? '✓' : '⚠';
            
            toast.innerHTML = `
                <span class="toast-status-icon">${icon}</span>
                <div class="toast-body-text">${message}</div>
                <button class="toast-close-btn" onclick="removeToast('${toastId}')"><i class="bi bi-x-lg"></i></button>
            `;

            container.appendChild(toast);

            // Auto dismiss after 4 seconds
            setTimeout(() => {
                removeToast(toastId);
            }, 4000);
        }

        function removeToast(id) {
            const toast = document.getElementById(id);
            if (toast) {
                toast.style.animation = 'slideIn 0.2s reverse forwards';
                setTimeout(() => {
                    toast.remove();
                }, 200);
            }
        }
    </script>
</div>
