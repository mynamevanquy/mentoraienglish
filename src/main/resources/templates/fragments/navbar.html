<header th:fragment="navbar" class="app-header-nav" xmlns:th="http://www.thymeleaf.org">
    <style>
        .app-header-nav {
            height: 70px;
            background: rgba(10, 10, 18, 0.5);
            border-bottom: 1px solid var(--surface-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-toggle-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--surface-border);
            color: var(--text-secondary);
            border-radius: 8px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .menu-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .header-page-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* User Avatar Dropdown styling */
        .user-dropdown-toggle {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 0;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: var(--brand-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(108, 99, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .user-meta {
            text-align: left;
        }

        .user-name {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .user-role {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .dropdown-menu-dark {
            background: rgba(10, 10, 18, 0.95) !important;
            border: 1px solid var(--surface-border) !important;
            border-radius: var(--radius-md) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
            margin-top: 10px !important;
        }

        .dropdown-item {
            border-radius: 8px !important;
            font-size: 13px !important;
            padding: 10px 16px !important;
            color: var(--text-secondary) !important;
            transition: var(--transition-smooth) !important;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.04) !important;
            color: var(--text-primary) !important;
        }

        .dropdown-item-danger:hover {
            background: rgba(255, 107, 107, 0.1) !important;
            color: #FF6B6B !important;
        }

        .dropdown-divider {
            border-color: var(--surface-border) !important;
        }

        @media (max-width: 992px) {
            .user-meta {
                display: none;
            }
        }
    </style>

    <div class="header-left">
        <!-- Sidebar Toggle Hamburger Button (Mobile & Desktop) -->
        <button class="menu-toggle-btn" onclick="toggleSidebarMobileOrDesktop()">
            <i class="bi bi-list fs-5"></i>
        </button>

        <!-- Dynamic Header Title -->
        <h2 class="header-page-title d-none d-sm-block">
            <span th:if="${currentUri == '/dashboard'}">📊 Tổng quan học tập</span>
            <span th:if="${currentUri != null && currentUri.startsWith('/vocabulary')}">📚 Từ vựng (Spaced Repetition)</span>
            <span th:if="${currentUri != null && currentUri.startsWith('/grammar')}">📖 Bài học ngữ pháp</span>
            <span th:if="${currentUri != null && currentUri.startsWith('/exercises')}">📝 Luyện tập & Đánh giá</span>
            <span th:if="${currentUri != null && currentUri.startsWith('/conversation')}">💬 Phòng Chat AI</span>
            <span th:if="${currentUri != null && currentUri.startsWith('/progress')}">📈 Tiến trình & Thống kê</span>
        </h2>
    </div>

    <div class="header-right">
        <!-- User Dropdown Menu -->
        <div class="dropdown">
            <button class="user-dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="user-avatar" th:text="${username != null ? #strings.substring(username, 0, 1).toUpperCase() : ''}">U</div>
                <div class="user-meta">
                    <span class="user-name" th:text="${username}">Học viên</span>
                    <span class="user-role">Thành viên Premium</span>
                </div>
                <i class="bi bi-chevron-down text-secondary fs-7 ms-1"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
                <li>
                    <a class="dropdown-item" th:href="@{/profile}">
                        <i class="bi bi-person me-2"></i> Hồ sơ cá nhân
                    </a>
                </li>
                <li>
                    <a class="dropdown-item" th:href="@{/settings}">
                        <i class="bi bi-gear me-2"></i> Cài đặt tài khoản
                    </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" th:method="post" class="d-block m-0">
                        <button type="submit" class="dropdown-item dropdown-item-danger w-100 text-start border-0 bg-transparent">
                            <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>

    <!-- Small script specific to mobile toggle behavior -->
    <script>
        function toggleSidebarMobileOrDesktop() {
            if (window.innerWidth <= 992) {
                const sidebar = document.getElementById('appSidebar');
                if (sidebar) {
                    sidebar.classList.toggle('show-mobile');
                }
            } else {
                toggleSidebar(); // Calls the global function defined in main.html
            }
        }
    </script>
</header>
