<div th:fragment="sidebar" id="appSidebar" class="app-sidebar" xmlns:th="http://www.thymeleaf.org">
    <style>
        .app-sidebar {
            width: var(--sidebar-width);
            background: rgba(10, 10, 18, 0.95);
            border-right: 1px solid var(--surface-border);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: var(--transition-smooth);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .app-sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar-brand {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--surface-border);
            gap: 12px;
            overflow: hidden;
            white-space: nowrap;
        }

        .sidebar-brand-icon {
            width: 32px;
            height: 32px;
            background: var(--brand-gradient);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .sidebar-brand-text {
            font-size: 16px;
            font-weight: 700;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            transition: var(--transition-smooth);
        }

        .app-sidebar.collapsed .sidebar-brand-text {
            opacity: 0;
            pointer-events: none;
        }

        /* Menu Items */
        .sidebar-menu {
            flex-grow: 1;
            padding: 24px 16px;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            margin: 0;
        }

        .sidebar-item a {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: var(--radius-md);
            gap: 16px;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition-smooth);
            white-space: nowrap;
        }

        .sidebar-item a i {
            font-size: 18px;
            flex-shrink: 0;
            color: var(--text-secondary);
            transition: var(--transition-smooth);
        }

        /* Hover and Active states */
        .sidebar-item a:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
        }

        .sidebar-item a:hover i {
            color: var(--brand-primary);
        }

        .sidebar-item.active a {
            background: var(--brand-gradient);
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.25);
        }

        .sidebar-item.active a i {
            color: #fff !important;
        }

        .app-sidebar.collapsed .sidebar-item a {
            padding: 12px 0;
            justify-content: center;
        }

        .app-sidebar.collapsed .sidebar-item a span {
            display: none;
        }

        /* Collapse trigger button at the bottom */
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--surface-border);
            display: flex;
            justify-content: center;
        }

        .collapse-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            width: 100%;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .collapse-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .app-sidebar.collapsed .collapse-btn i {
            transform: rotate(180deg);
        }

        /* Mobile Responsive Navigation overlay */
        @media (max-width: 992px) {
            .app-sidebar {
                transform: translateX(-100%);
            }
            .app-sidebar.show-mobile {
                transform: translateX(0);
                width: var(--sidebar-width) !important;
            }
            .app-sidebar.show-mobile .sidebar-brand-text,
            .app-sidebar.show-mobile .sidebar-item a span {
                display: inline-block !important;
                opacity: 1 !important;
            }
            .sidebar-footer {
                display: none;
            }
        }
    </style>

    <!-- Sidebar Header -->
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon">🎓</div>
        <span class="sidebar-brand-text">MentorAI English</span>
    </div>

    <!-- Navigation List items -->
    <ul class="sidebar-menu">
        <!-- Dashboard -->
        <li class="sidebar-item" th:classappend="${currentUri == '/dashboard'} ? 'active'">
            <a th:href="@{/dashboard}">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Tổng quan</span>
            </a>
        </li>
        <!-- Vocabulary -->
        <li class="sidebar-item" th:classappend="${currentUri != null && currentUri.startsWith('/vocabulary')} ? 'active'">
            <a th:href="@{/vocabulary}">
                <i class="bi bi-journal-bookmark-fill"></i>
                <span>Từ vựng</span>
            </a>
        </li>
        <!-- Grammar -->
        <li class="sidebar-item" th:classappend="${currentUri != null && currentUri.startsWith('/grammar')} ? 'active'">
            <a th:href="@{/grammar}">
                <i class="bi bi-book-half"></i>
                <span>Ngữ pháp</span>
            </a>
        </li>
        <!-- Exercises -->
        <li class="sidebar-item" th:classappend="${currentUri != null && currentUri.startsWith('/exercises')} ? 'active'">
            <a th:href="@{/exercises}">
                <i class="bi bi-pencil-square"></i>
                <span>Luyện tập</span>
            </a>
        </li>
        <!-- AI Chat -->
        <li class="sidebar-item" th:classappend="${currentUri != null && currentUri.startsWith('/conversation')} ? 'active'">
            <a th:href="@{/conversation}">
                <i class="bi bi-chat-left-dots-fill"></i>
                <span>Phòng chat AI</span>
            </a>
        </li>
        <!-- Progress -->
        <li class="sidebar-item" th:classappend="${currentUri != null && currentUri.startsWith('/progress')} ? 'active'">
            <a th:href="@{/progress}">
                <i class="bi bi-bar-chart-line-fill"></i>
                <span>Tiến trình học</span>
            </a>
        </li>
        <!-- Admin users -->
        <li class="sidebar-item" th:if="${isAdmin}" th:classappend="${currentUri != null && currentUri.startsWith('/admin/users')} ? 'active'">
            <a th:href="@{/admin/users}">
                <i class="bi bi-people-fill"></i>
                <span>Quản lý người dùng</span>
            </a>
        </li>
    </ul>

    <!-- Sidebar Collapse Trigger Button at Bottom -->
    <div class="sidebar-footer">
        <button class="collapse-btn" onclick="toggleSidebar()">
            <i class="bi bi-chevron-left"></i>
        </button>
    </div>
</div>
