spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    clean-disabled: true # Critical security configuration to prevent database loss in prod
    clean-on-validation-error: false
    locations: classpath:db/migration

  session:
    store-type: redis # Production uses Redis for session sharing across multiple app instances
    redis:
      namespace: mentor-ai-english:session

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true # Enable SSL for production Redis security

server:
  port: ${SERVER_PORT:8083}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: true # Cookies only sent over HTTPS in production
        same-site: lax

openai:
  api:
    key: ${OPENGATEWAY_API_KEY}
    url: https://opengateway.gitlawb.com/v1

logging:
  level:
    root: INFO
    com.englishai: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN

bucket4j:
  enabled: true
  filters:
    - cache-name: buckets
      filter-method: servlet
      url: /api/.*
      rate-limits:
        - bandwidths:
            - capacity: 100
              time: 1
              unit: minutes
              refill-speed: greedy
